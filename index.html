<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APP BETAGEN</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:Arial,sans-serif;
    background:#0F172A;
    color:#fff;
}

button,input,textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.header{
    height:64px;
    background:#111827;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    position:sticky;
    top:0;
    z-index:20;
    border-bottom:1px solid #1f2937;
}

.logo{
    font-size:20px;
    font-weight:800;
}

.header-actions{
    display:flex;
    gap:8px;
}

.icon-btn{
    border:0;
    background:#1e293b;
    color:#fff;
    border-radius:12px;
    width:44px;
    height:44px;
    font-size:19px;
    position:relative;
}

.cart-count{
    position:absolute;
    top:-4px;
    right:-4px;
    min-width:19px;
    height:19px;
    border-radius:50%;
    background:#2563eb;
    font-size:11px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.page{
    display:none;
    padding:18px;
    max-width:700px;
    margin:auto;
}

.page.active{
    display:block;
}

.section-title{
    font-size:24px;
    font-weight:800;
    margin-bottom:16px;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.product{
    background:#111827;
    border:1px solid #1f2937;
    border-radius:18px;
    padding:14px;
}

.product-image{
    width:100%;
    height:150px;
    border-radius:14px;
    background:#1e293b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    margin-bottom:12px;
}

.product-name{
    font-size:16px;
    font-weight:700;
    margin-bottom:6px;
}

.product-price{
    color:#60a5fa;
    font-size:18px;
    font-weight:800;
    margin-bottom:10px;
}

.primary-btn{
    width:100%;
    border:0;
    border-radius:13px;
    padding:13px;
    background:#2563eb;
    color:#fff;
    font-size:15px;
    font-weight:700;
}

.secondary-btn{
    width:100%;
    border:1px solid #334155;
    border-radius:13px;
    padding:13px;
    background:#1e293b;
    color:#fff;
    font-size:15px;
    font-weight:700;
}

.danger-btn{
    width:100%;
    border:0;
    border-radius:13px;
    padding:13px;
    background:#dc2626;
    color:#fff;
    font-size:15px;
    font-weight:700;
}

.form-group{
    margin-bottom:14px;
}

.form-label{
    display:block;
    margin-bottom:7px;
    color:#cbd5e1;
    font-size:14px;
}

.input{
    width:100%;
    border:1px solid #334155;
    background:#111827;
    color:#fff;
    border-radius:13px;
    padding:14px;
    outline:none;
    font-size:15px;
}

.input:focus{
    border-color:#3b82f6;
}

.card{
    background:#111827;
    border:1px solid #1f2937;
    border-radius:18px;
    padding:16px;
    margin-bottom:14px;
}

.cart-item{
    display:flex;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid #1f2937;
}

.cart-item:last-child{
    border-bottom:0;
}

.cart-info{
    flex:1;
}

.cart-name{
    font-weight:700;
    margin-bottom:5px;
}

.cart-price{
    color:#60a5fa;
    font-weight:700;
}

.quantity{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:9px;
}

.quantity button{
    width:32px;
    height:32px;
    border:0;
    border-radius:9px;
    background:#334155;
    color:#fff;
    font-size:18px;
}

.remove-btn{
    background:none;
    border:0;
    color:#f87171;
    margin-top:8px;
}

.total{
    display:flex;
    justify-content:space-between;
    font-size:19px;
    font-weight:800;
    padding:15px 0;
}

.payment-option{
    border:1px solid #334155;
    border-radius:15px;
    padding:15px;
    margin-bottom:10px;
    cursor:pointer;
}

.payment-option.selected{
    border-color:#3b82f6;
    background:#172554;
}

.payment-title{
    font-weight:800;
    margin-bottom:5px;
}

.payment-description{
    color:#94a3b8;
    font-size:13px;
}

.qr-box{
    text-align:center;
    padding:15px;
    background:#fff;
    border-radius:15px;
    margin-top:12px;
}

.qr-box img{
    width:100%;
    max-width:300px;
}

.success{
    text-align:center;
    padding:40px 10px;
}

.success-icon{
    width:75px;
    height:75px;
    border-radius:50%;
    background:#16a34a;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 18px;
    font-size:36px;
}

.success h2{
    margin-bottom:10px;
}

.muted{
    color:#94a3b8;
}

.seller-status{
    background:#172554;
    border:1px solid #1d4ed8;
    padding:14px;
    border-radius:15px;
    margin-bottom:14px;
}

.seller-email{
    color:#93c5fd;
    word-break:break-all;
    margin-top:5px;
}

.info-row{
    padding:9px 0;
    border-bottom:1px solid #1f2937;
}

.info-row:last-child{
    border-bottom:0;
}

.info-label{
    color:#94a3b8;
    font-size:13px;
    margin-bottom:3px;
}

.info-value{
    word-break:break-word;
}

.empty{
    text-align:center;
    color:#94a3b8;
    padding:50px 10px;
}

.button-space{
    margin-top:10px;
}

@media(max-width:420px){
    .product-grid{
        grid-template-columns:1fr 1fr;
    }

    .product-image{
        height:125px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">APP BETAGEN</div>

    <div class="header-actions">

        <button
            class="icon-btn"
            onclick="showSeller()">
            👤
        </button>

        <button
            class="icon-btn"
            onclick="showCart()">
            🛒
            <span
                class="cart-count"
                id="cartCount">
                0
            </span>
        </button>

    </div>

</header>

<section
    id="productPage"
    class="page active">

    <div class="section-title">
        สินค้า
    </div>

    <div
        id="productList"
        class="product-grid">
    </div>

</section>

<section
    id="cartPage"
    class="page">

    <div class="section-title">
        ตะกร้าสินค้า
    </div>

    <div
        id="cartList">
    </div>

    <div
        id="cartTotal">
    </div>

    <button
        class="primary-btn"
        onclick="showCheckout()">
        ดำเนินการสั่งซื้อ
    </button>

    <div class="button-space">

        <button
            class="secondary-btn"
            onclick="showProducts()">
            เลือกซื้อสินค้าเพิ่ม
        </button>

    </div>

</section>

<section
    id="checkoutPage"
    class="page">

    <div class="section-title">
        ข้อมูลการจัดส่ง
    </div>

    <div class="card">

        <div class="form-group">

            <label class="form-label">
                ชื่อลูกค้า
            </label>

            <input
                id="customerName"
                class="input"
                type="text"
                placeholder="กรอกชื่อของคุณ">

        </div>

        <div class="form-group">

            <label class="form-label">
                เบอร์โทร
            </label>

            <input
                id="customerPhone"
                class="input"
                type="tel"
                placeholder="08xxxxxxxx">

        </div>

        <div class="form-group">

            <label class="form-label">
                ที่อยู่
            </label>

            <textarea
                id="customerAddress"
                class="input"
                rows="4"
                placeholder="กรอกที่อยู่สำหรับจัดส่ง"></textarea>

        </div>

        <button
            class="secondary-btn"
            onclick="clearCustomerData()">
            ลบข้อมูลลูกค้าที่บันทึกไว้
        </button>

    </div>

    <div class="section-title">
        วิธีชำระเงิน
    </div>

    <div
        class="card">

        <div
            id="codPayment"
            class="payment-option"
            onclick="selectPayment('cod')">

            <div class="payment-title">
                💵 ชำระเงินปลายทาง
            </div>

            <div class="payment-description">
                ชำระเงินเมื่อได้รับสินค้า
            </div>

        </div>

        <div
            id="qrPayment"
            class="payment-option"
            onclick="selectPayment('qr')">

            <div class="payment-title">
                📱 QR Payment
            </div>

            <div class="payment-description">
                สแกน QR เพื่อชำระเงิน
            </div>

        </div>

        <div
            id="qrArea"
            style="display:none">

            <div class="qr-box">

                <img
                    id="qrImage"
                    src=""
                    alt="QR">

            </div>

        </div>

    </div>

    <div class="card">

        <div class="section-title">
            สรุปคำสั่งซื้อ
        </div>

        <div
            id="checkoutSummary">
        </div>

    </div>

    <button
        class="primary-btn"
        onclick="createOrder()">
        ยืนยันคำสั่งซื้อ
    </button>

</section>

<section
    id="successPage"
    class="page">

    <div class="card success">

        <div class="success-icon">
            ✓
        </div>

        <h2>
            สั่งซื้อสำเร็จ
        </h2>

        <p
            id="successOrder"
            class="muted">
        </p>

        <div class="button-space">

            <button
                class="primary-btn"
                onclick="showProducts()">
                กลับหน้าสินค้า
            </button>

        </div>

    </div>

</section>

<section
    id="sellerPage"
    class="page">

    <div class="section-title">
        ระบบเซลล์
    </div>

    <div
        id="sellerLoggedIn"
        style="display:none">

        <div class="seller-status">

            <div>
                👤 เซลล์ที่เข้าสู่ระบบ
            </div>

            <div
                id="sellerNicknameView"
                style="font-weight:800;margin-top:7px">
            </div>

            <div
                id="sellerEmailView"
                class="seller-email">
            </div>

        </div>

        <div class="card">

            <div class="form-group">

                <label class="form-label">
                    อีเมลเซลล์
                </label>

                <input
                    id="loggedSellerEmail"
                    class="input"
                    type="email">

            </div>

            <div class="form-group">

                <label class="form-label">
                    ชื่อเล่น
                </label>

                <input
                    id="loggedSellerNickname"
                    class="input"
                    type="text">

            </div>

            <button
                class="primary-btn"
                onclick="updateSeller()">
                บันทึกการเปลี่ยนแปลง
            </button>

            <div class="button-space">

                <button
                    class="secondary-btn"
                    onclick="logoutSeller()">
                    ออกจากระบบ
                </button>

            </div>

            <div class="button-space">

                <button
                    class="danger-btn"
                    onclick="deleteSeller()">
                    ลบข้อมูลเซลล์
                </button>

            </div>

        </div>

    </div>

    <div
        id="sellerLogin">

        <div class="card">

            <div class="form-group">

                <label class="form-label">
                    อีเมล
                </label>

                <input
                    id="sellerEmail"
                    class="input"
                    type="email"
                    placeholder="seller@example.com">

            </div>

            <div class="form-group">

                <label class="form-label">
                    ชื่อเล่น
                </label>

                <input
                    id="sellerNickname"
                    class="input"
                    type="text"
                    placeholder="ชื่อเล่นของเซลล์">

            </div>

            <button
                class="primary-btn"
                onclick="registerSeller()">
                สมัคร / เข้าสู่ระบบ
            </button>

        </div>

        <div class="card">

            <div class="muted">
                ระบบจะจดจำอีเมลและชื่อเล่นของเซลล์ไว้ในเครื่องนี้ จนกว่าจะเปลี่ยนหรือลบข้อมูล
            </div>

        </div>

    </div>

</section>

<script>

var products = [

    {
        id:1,
        name:"รสดั้งเดิม",
        price:15,
        image:""
    },

    {
        id:2,
        name:"รสสตรอว์เบอร์รี่",
        price:15,
        image:""
    },

    {
        id:3,
        name:"รสพีช",
        price:15,
        image:""
    },

    {
        id:4,
        name:"รสแอปเปิ้ล",
        price:15,
        image:""
    },

    {
        id:5,
        name:"รสบลูเบอร์รี่",
        price:15,
        image:""
    },

    {
        id:6,
        name:"รสผลไม้รวม",
        price:15,
        image:""
    }

];

var cart = JSON.parse(
    localStorage.getItem("betagen_cart") || "[]"
);

var orders = JSON.parse(
    localStorage.getItem("betagen_orders") || "[]"
);

var seller = JSON.parse(
    localStorage.getItem("betagen_seller") || "null"
);

var customer = JSON.parse(
    localStorage.getItem("betagen_customer") || "null"
);

var selectedPayment = "";

function saveCart(){

    localStorage.setItem(
        "betagen_cart",
        JSON.stringify(cart)
    );

}

function saveOrders(){

    localStorage.setItem(
        "betagen_orders",
        JSON.stringify(orders)
    );

}

function saveSeller(){

    localStorage.setItem(
        "betagen_seller",
        JSON.stringify(seller)
    );

}

function saveCustomer(){

    customer = {

        name:document.getElementById("customerName").value.trim(),

        phone:document.getElementById("customerPhone").value.trim(),

        address:document.getElementById("customerAddress").value.trim()

    };

    localStorage.setItem(
        "betagen_customer",
        JSON.stringify(customer)
    );

}

function renderProducts(){

    var html = "";

    for(var i=0;i<products.length;i++){

        var p = products[i];

        html +=
        '<div class="product">' +

            '<div class="product-image">' +
                '🥛' +
            '</div>' +

            '<div class="product-name">' +
                p.name +
            '</div>' +

            '<div class="product-price">' +
                formatPrice(p.price) +
                ' บาท' +
            '</div>' +

            '<button class="primary-btn" onclick="addToCart(' +
                p.id +
            ')">' +
                'เพิ่มลงตะกร้า' +
            '</button>' +

        '</div>';

    }

    document.getElementById(
        "productList"
    ).innerHTML = html;

}

function findProduct(id){

    for(var i=0;i<products.length;i++){

        if(products[i].id == id){

            return products[i];

        }

    }

    return null;

}

function addToCart(id){

    var item = null;

    for(var i=0;i<cart.length;i++){

        if(cart[i].id == id){

            item = cart[i];
            break;

        }

    }

    if(item){

        item.quantity++;

    }else{

        cart.push({
            id:id,
            quantity:1
        });

    }

    saveCart();
    updateCartCount();

}

function updateCartCount(){

    var count = 0;

    for(var i=0;i<cart.length;i++){

        count += cart[i].quantity;

    }

    document.getElementById(
        "cartCount"
    ).innerText = count;

}

function renderCart(){

    var box = document.getElementById(
        "cartList"
    );

    if(cart.length === 0){

        box.innerHTML =
            '<div class="empty">' +
            'ยังไม่มีสินค้าในตะกร้า' +
            '</div>';

        document.getElementById(
            "cartTotal"
        ).innerHTML = "";

        return;

    }

    var html = "";
    var total = 0;

    for(var i=0;i<cart.length;i++){

        var item = cart[i];

        var p = findProduct(item.id);

        if(!p){
            continue;
        }

        var subtotal =
            p.price * item.quantity;

        total += subtotal;

        html +=
        '<div class="card cart-item">' +

            '<div class="cart-info">' +

                '<div class="cart-name">' +
                    p.name +
                '</div>' +

                '<div class="cart-price">' +
                    formatPrice(p.price) +
                    ' บาท' +
                '</div>' +

                '<div class="quantity">' +

                    '<button onclick="changeQuantity(' +
                        p.id +
                        ',-1)">−</button>' +

                    '<span>' +
                        item.quantity +
                    '</span>' +

                    '<button onclick="changeQuantity(' +
                        p.id +
                        ',1)">+</button>' +

                '</div>' +

                '<button class="remove-btn" onclick="removeFromCart(' +
                    p.id +
                ')">' +
                    'ลบสินค้า' +
                '</button>' +

            '</div>' +

        '</div>';

    }

    box.innerHTML = html;

    document.getElementById(
        "cartTotal"
    ).innerHTML =
        '<div class="card total">' +

            '<span>รวมทั้งหมด</span>' +

            '<span>' +
                formatPrice(total) +
                ' บาท' +
            '</span>' +

        '</div>';

}

function changeQuantity(id,value){

    for(var i=0;i<cart.length;i++){

        if(cart[i].id == id){

            cart[i].quantity += value;

            if(cart[i].quantity <= 0){

                cart.splice(i,1);

            }

            break;

        }

    }

    saveCart();
    updateCartCount();
    renderCart();

}

function removeFromCart(id){

    for(var i=0;i<cart.length;i++){

        if(cart[i].id == id){

            cart.splice(i,1);
            break;

        }

    }

    saveCart();
    updateCartCount();
    renderCart();

}

function showPage(id){

    var pages =
        document.querySelectorAll(".page");

    for(var i=0;i<pages.length;i++){

        pages[i].classList.remove("active");

    }

    document.getElementById(
        id
    ).classList.add("active");

    window.scrollTo(0,0);

}

function showProducts(){

    showPage("productPage");

}

function showCart(){

    renderCart();

    showPage("cartPage");

}

function loadCustomer(){

    customer = JSON.parse(
        localStorage.getItem(
            "betagen_customer"
        ) || "null"
    );

    if(!customer){
        return;
    }

    document.getElementById(
        "customerName"
    ).value = customer.name || "";

    document.getElementById(
        "customerPhone"
    ).value = customer.phone || "";

    document.getElementById(
        "customerAddress"
    ).value = customer.address || "";

}

function clearCustomerData(){

    if(!confirm(
        "ต้องการลบข้อมูลลูกค้าที่บันทึกไว้หรือไม่?"
    )){
        return;
    }

    localStorage.removeItem(
        "betagen_customer"
    );

    document.getElementById(
        "customerName"
    ).value = "";

    document.getElementById(
        "customerPhone"
    ).value = "";

    document.getElementById(
        "customerAddress"
    ).value = "";

}

function showCheckout(){

    if(cart.length === 0){

        alert("กรุณาเพิ่มสินค้าลงตะกร้าก่อน");

        return;

    }

    loadCustomer();

    selectedPayment = "";

    document.getElementById(
        "codPayment"
    ).classList.remove("selected");

    document.getElementById(
        "qrPayment"
    ).classList.remove("selected");

    document.getElementById(
        "qrArea"
    ).style.display = "none";

    renderCheckoutSummary();

    showPage("checkoutPage");

}

function selectPayment(type){

    selectedPayment = type;

    document.getElementById(
        "codPayment"
    ).classList.remove("selected");

    document.getElementById(
        "qrPayment"
    ).classList.remove("selected");

    if(type === "cod"){

        document.getElementById(
            "codPayment"
        ).classList.add("selected");

        document.getElementById(
            "qrArea"
        ).style.display = "none";

    }

    if(type === "qr"){

        document.getElementById(
            "qrPayment"
        ).classList.add("selected");

        generateQr();

    }

}

function renderCheckoutSummary(){

    var total = 0;
    var html = "";

    for(var i=0;i<cart.length;i++){

        var item = cart[i];

        var p = findProduct(item.id);

        if(!p){
            continue;
        }

        var subtotal =
            p.price * item.quantity;

        total += subtotal;

        html +=
        '<div class="info-row">' +

            '<div class="info-label">' +
                p.name +
            '</div>' +

            '<div class="info-value">' +
                item.quantity +
                ' × ' +
                formatPrice(p.price) +
                ' = ' +
                formatPrice(subtotal) +
                ' บาท' +
            '</div>' +

        '</div>';

    }

    html +=
        '<div class="total">' +
            '<span>ยอดรวม</span>' +
            '<span>' +
                formatPrice(total) +
                ' บาท' +
            '</span>' +
        '</div>';

    document.getElementById(
        "checkoutSummary"
    ).innerHTML = html;

}

function getTotal(){

    var total = 0;

    for(var i=0;i<cart.length;i++){

        var p = findProduct(cart[i].id);

        if(p){

            total +=
                p.price *
                cart[i].quantity;

        }

    }

    return total;

}

function generateQr(){

    var amount = getTotal();

    var payload =
        "BETAGEN|" +
        amount +
        "|" +
        Date.now();

    var url =
        "https://api.qrserver.com/v1/create-qr-code/" +
        "?size=500x500&data=" +
        encodeURIComponent(payload);

    document.getElementById(
        "qrImage"
    ).src = url;

    document.getElementById(
        "qrArea"
    ).style.display = "block";

}

function renderSeller(){

    var logged =
        document.getElementById(
            "sellerLoggedIn"
        );

    var login =
        document.getElementById(
            "sellerLogin"
        );

    if(seller){

        logged.style.display = "block";
        login.style.display = "none";

        document.getElementById(
            "sellerNicknameView"
        ).innerText =
            seller.nickname;

        document.getElementById(
            "sellerEmailView"
        ).innerText =
            seller.email;

        document.getElementById(
            "loggedSellerEmail"
        ).value =
            seller.email;

        document.getElementById(
            "loggedSellerNickname"
        ).value =
            seller.nickname;

    }else{

        logged.style.display = "none";
        login.style.display = "block";

    }

}

function isValidEmail(email){

    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
        email
    );

}

function createOrder(){

    var name =
        document.getElementById(
            "customerName"
        ).value.trim();

    var phone =
        document.getElementById(
            "customerPhone"
        ).value.trim();

    var address =
        document.getElementById(
            "customerAddress"
        ).value.trim();

    if(name.length === 0){

        alert("กรุณากรอกชื่อลูกค้า");

        return;

    }

    if(phone.length === 0){

        alert("กรุณากรอกเบอร์โทร");

        return;

    }

    if(address.length === 0){

        alert("กรุณากรอกที่อยู่");

        return;

    }

    if(selectedPayment === ""){

        alert("กรุณาเลือกวิธีชำระเงิน");

        return;

    }

    if(!seller){

        alert(
            "กรุณาตั้งค่าอีเมลเซลล์ก่อนสั่งซื้อ"
        );

        showSeller();

        return;

    }

    saveCustomer();

    var now = new Date();

    var date =
        String(now.getFullYear()).slice(-2) +
        String(now.getMonth()+1).padStart(2,"0") +
        String(now.getDate()).padStart(2,"0");

    var random =
        Math.floor(
            1000 +
            Math.random() * 9000
        );

    var orderNumber =
        "BT" +
        date +
        random;

    var paymentMethod =
        selectedPayment === "cod"
        ? "ชำระเงินปลายทาง"
        : "QR Payment";

    var total = getTotal();

    var order = {

        id:orderNumber,

        date:now.toISOString(),

        payment:paymentMethod,

        total:total,

        customer:{

            name:name,

            phone:phone,

            address:address

        },

        items:cart.slice(),

        sellerEmail:seller.email,

        sellerNickname:seller.nickname

    };

    orders.push(order);

    saveOrders();

    sendOrderEmail(order);

    cart = [];

    saveCart();

    updateCartCount();

    document.getElementById(
        "successOrder"
    ).innerHTML =
        "เลขที่คำสั่งซื้อ: " +
        orderNumber;

    showPage("successPage");

}

function sendOrderEmail(order){

    var subject =
        "APP BETAGEN - คำสั่งซื้อ " +
        order.id;

    var body = "";

    body +=
        "APP BETAGEN\n\n";

    body +=
        "คำสั่งซื้อ: " +
        order.id +
        "\n";

    body +=
        "วิธีชำระเงิน: " +
        order.payment +
        "\n";

    body +=
        "ยอดรวม: " +
        formatPrice(order.total) +
        " บาท\n\n";

    body +=
        "ชื่อลูกค้า: " +
        order.customer.name +
        "\n";

    body +=
        "เบอร์ลูกค้า: " +
        order.customer.phone +
        "\n";

    body +=
        "ที่อยู่: " +
        order.customer.address +
        "\n\n";

    body +=
        "รายการสินค้า:\n";

    for(var i=0;i<order.items.length;i++){

        var item = order.items[i];

        var p =
            findProduct(item.id);

        if(!p){
            continue;
        }

        body +=
            "- " +
            p.name +
            " x " +
            item.quantity +
            " = " +
            formatPrice(
                p.price *
                item.quantity
            ) +
            " บาท\n";

    }

    body +=
        "\nส่งจาก APP BETAGEN";

    var mailto =
        "mailto:" +
        encodeURIComponent(
            order.sellerEmail
        ) +
        "?subject=" +
        encodeURIComponent(subject) +
        "&body=" +
        encodeURIComponent(body);

    window.location.href = mailto;

}

function formatPrice(value){

    return Number(value).toLocaleString(
        "th-TH"
    );

}

renderProducts();
updateCartCount();
renderSeller();
