<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APP BETAGEN</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Arial,"Tahoma",sans-serif;background:#f5f7fb;color:#111827}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e5e7eb}
.header-inner{max-width:1100px;margin:auto;height:68px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.logo{font-size:21px;font-weight:800;color:#2563eb;cursor:pointer}
.nav{display:flex;align-items:center;gap:8px}
.nav button{border:0;background:#f1f5f9;color:#334155;border-radius:13px;padding:10px 13px}
.nav button:hover{background:#e2e8f0}
.cart-button{position:relative}
.cart-count{position:absolute;right:-4px;top:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:20px;background:#ef4444;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.main{max-width:1100px;margin:auto;padding:25px 18px 50px}
.page{display:none}
.page.active{display:block}
.hero{background:linear-gradient(135deg,#2563eb,#4f46e5);border-radius:25px;padding:34px;color:#fff;margin-bottom:25px;box-shadow:0 15px 40px rgba(37,99,235,.18)}
.hero h1{margin:0 0 8px;font-size:34px}
.hero p{margin:0;opacity:.9}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 0 15px}
.section-title h2{margin:0;font-size:22px}
.product-list{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.product-card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;overflow:hidden;box-shadow:0 5px 20px rgba(15,23,42,.05)}
.product-image{height:210px;background:linear-gradient(135deg,#dbeafe,#e0e7ff);display:flex;align-items:center;justify-content:center;color:#2563eb;font-size:48px;font-weight:800}
.product-image img{width:100%;height:100%;object-fit:cover}
.product-info{padding:18px}
.product-name{font-size:18px;font-weight:700;margin-bottom:7px}
.product-price{font-size:20px;font-weight:800;color:#2563eb;margin-bottom:15px}
.primary{border:0;background:#2563eb;color:#fff;border-radius:13px;padding:12px 17px;font-weight:700}
.primary:hover{background:#1d4ed8}
.secondary{border:0;background:#e2e8f0;color:#334155;border-radius:13px;padding:12px 17px;font-weight:700}
.danger{border:0;background:#fee2e2;color:#dc2626;border-radius:12px;padding:9px 12px;font-weight:700}
.full{width:100%}
.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:20px;padding:35px;text-align:center;color:#64748b}
.cart-layout{display:grid;grid-template-columns:1.5fr .8fr;gap:20px}
.cart-list{display:flex;flex-direction:column;gap:12px}
.cart-item{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:15px;display:flex;align-items:center;gap:15px}
.cart-item-image{width:70px;height:70px;border-radius:15px;background:#dbeafe;display:flex;align-items:center;justify-content:center;color:#2563eb;font-weight:800;font-size:24px;overflow:hidden}
.cart-item-image img{width:100%;height:100%;object-fit:cover}
.cart-item-main{flex:1}
.cart-item-name{font-weight:700;margin-bottom:5px}
.cart-item-price{color:#64748b;font-size:14px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;border:0;border-radius:9px;background:#e2e8f0}
.qty span{min-width:25px;text-align:center;font-weight:700}
.cart-summary{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:20px;height:max-content;position:sticky;top:90px}
.summary-row{display:flex;justify-content:space-between;margin:10px 0;color:#64748b}
.summary-total{border-top:1px solid #e5e7eb;padding-top:14px;margin-top:15px;font-size:20px;font-weight:800;color:#111827}
.account-card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px;margin-bottom:18px}
.account-email{font-size:18px;font-weight:700}
.account-role{color:#64748b;margin-top:5px}
.account-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.field{display:flex;flex-direction:column;gap:7px}
.field.full-field{grid-column:1/-1}
.field label{font-weight:700;font-size:14px}
.field input,.field textarea,.field select{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:12px 13px;outline:none;background:#fff}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:100;align-items:center;justify-content:center;padding:18px}
.overlay.show{display:flex}
.modal{width:100%;max-width:480px;max-height:90vh;overflow:auto;background:#fff;border-radius:24px;padding:24px;box-shadow:0 25px 80px rgba(0,0,0,.25)}
.modal h2{margin:0 0 18px}
.modal-close{float:right;border:0;background:#f1f5f9;width:35px;height:35px;border-radius:50%;font-size:20px}
.tabs{display:flex;gap:7px;margin-bottom:18px;background:#f1f5f9;padding:5px;border-radius:14px}
.tabs button{flex:1;border:0;padding:10px;border-radius:10px;background:transparent}
.tabs button.active{background:#fff;color:#2563eb;font-weight:700;box-shadow:0 2px 7px rgba(15,23,42,.08)}
.form{display:flex;flex-direction:column;gap:14px}
.hidden{display:none!important}
.note{font-size:13px;color:#64748b;line-height:1.6}
.alert{padding:12px 14px;border-radius:12px;background:#eff6ff;color:#1d4ed8;font-size:14px}
.seller-area,.route-item,.order-card{border:1px solid #e5e7eb;border-radius:16px;padding:15px;margin-top:10px;background:#f8fafc}
.item-header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.route-item{background:#fff}
.order-status{display:inline-block;padding:5px 9px;border-radius:20px;background:#fef3c7;color:#92400e;font-size:12px;font-weight:700}
.order-total{font-size:19px;font-weight:800;color:#2563eb;margin-top:10px}
.loading{text-align:center;padding:35px;color:#64748b}
@media(max-width:800px){
.product-list{grid-template-columns:repeat(2,1fr)}
.cart-layout{grid-template-columns:1fr}
.cart-summary{position:static}
}
@media(max-width:550px){
.header-inner{height:auto;min-height:65px}
.logo{font-size:17px}
.nav button{padding:9px}
.main{padding:18px 13px 40px}
.hero{padding:25px 20px}
.hero h1{font-size:27px}
.product-list{grid-template-columns:1fr}
.product-image{height:190px}
.form-grid{grid-template-columns:1fr}
.field.full-field{grid-column:auto}
.cart-item{align-items:flex-start;flex-wrap:wrap}
.cart-item-main{min-width:calc(100% - 90px)}
.qty{margin-left:85px}
}
</style>
</head>
<body>

<header class="header">
<div class="header-inner">
<div class="logo" onclick="showProducts()">APP BETAGEN</div>
<div class="nav">
<button onclick="showProducts()">สินค้า</button>
<button class="cart-button" onclick="showCart()">🛒 ตะกร้า <span id="cartCount" class="cart-count">0</span></button>
<button onclick="openAccount()">👤 บัญชี</button>
</div>
</div>
</header>

<main class="main">

<section id="productPage" class="page active">
<div class="hero">
<h1>APP BETAGEN</h1>
<p>เลือกสินค้าที่ต้องการ แล้วสั่งซื้อได้ง่าย ๆ</p>
</div>
<div class="section-title">
<h2>สินค้าทั้งหมด</h2>
</div>
<div id="productList" class="product-list">
<div class="loading">กำลังโหลดสินค้า...</div>
</div>
</section>

<section id="cartPage" class="page">
<div class="section-title">
<h2>ตะกร้าสินค้า</h2>
<button class="secondary" onclick="showProducts()">เลือกสินค้าเพิ่ม</button>
</div>
<div id="cartContent"></div>
</section>

<section id="accountPage" class="page">
<div class="section-title">
<h2>บัญชีของฉัน</h2>
</div>
<div id="accountContent"></div>
</section>

</main>

<div id="authOverlay" class="overlay">
<div class="modal">
<button class="modal-close" onclick="closeAuth()">×</button>
<h2>บัญชี APP BETAGEN</h2>

<div class="tabs">
<button id="loginTab" class="active" onclick="switchAuth('login')">เข้าสู่ระบบ</button>
<button id="registerTab" onclick="switchAuth('register')">สมัครสมาชิก</button>
</div>

<form id="loginForm" class="form" onsubmit="login(event)">
<div class="field">
<label>อีเมล</label>
<input id="loginEmail" type="email" required>
</div>
<div class="field">
<label>รหัสผ่าน</label>
<input id="loginPassword" type="password" required>
</div>
<button class="primary full" type="submit">เข้าสู่ระบบ</button>
</form>

<form id="registerForm" class="form hidden" onsubmit="registerRequest(event)">
<div class="field">
<label>อีเมล</label>
<input id="registerEmail" type="email" required>
</div>
<div class="field">
<label>รหัสผ่าน</label>
<input id="registerPassword" type="password" minlength="6" required>
</div>
<div class="field">
<label>ยืนยันรหัสผ่าน</label>
<input id="registerPassword2" type="password" minlength="6" required>
</div>
<button class="primary full" type="submit">สมัครสมาชิก</button>
</form>
</div>
</div>

<div id="otpOverlay" class="overlay">
<div class="modal">
<button class="modal-close" onclick="closeOtp()">×</button>
<h2>ยืนยัน OTP</h2>
<p class="note">กรุณากรอกรหัส OTP 6 หลักที่ส่งไปยังอีเมลของคุณ</p>
<form class="form" onsubmit="registerVerify(event)">
<div class="field">
<label>รหัส OTP</label>
<input id="otpCode" type="text" inputmode="numeric" maxlength="6" required>
</div>
<button class="primary full" type="submit">ยืนยันการสมัคร</button>
</form>
</div>
</div>

<div id="checkoutOverlay" class="overlay">
<div class="modal">
<button class="modal-close" onclick="closeCheckout()">×</button>
<h2>ยืนยันคำสั่งซื้อ</h2>
<form class="form" onsubmit="createOrder(event)">

<div class="form-grid">

<div class="field">
<label>ชื่อผู้รับ</label>
<input id="checkoutName" required>
</div>

<div class="field">
<label>เบอร์โทรศัพท์</label>
<input id="checkoutPhone" required>
</div>

<div class="field full-field">
<label>ที่อยู่</label>
<textarea id="checkoutAddress" required></textarea>
</div>

<div class="field">
<label>จังหวัด</label>
<input id="checkoutProvince" required>
</div>

<div class="field">
<label>อำเภอ</label>
<input id="checkoutDistrict" required>
</div>

<div class="field">
<label>ตำบล</label>
<input id="checkoutSubdistrict" required>
</div>

<div class="field">
<label>วันที่จัดส่ง</label>
<input id="checkoutDate" type="date" required>
</div>

<div class="field">
<label>รอบจัดส่ง</label>
<select id="checkoutRound" required>
<option value="1">รอบ 1</option>
<option value="2">รอบ 2</option>
<option value="3">รอบ 3</option>
<option value="4">รอบ 4</option>
<option value="5">รอบ 5</option>
</select>
</div>

<div class="field">
<label>ชำระเงิน</label>
<select id="checkoutPayment" required>
<option value="cod">เก็บเงินปลายทาง</option>
<option value="transfer">โอนเงิน</option>
</select>
</div>

</div>

<div id="checkoutTotal" class="alert"></div>
<button class="primary full" type="submit">สั่งซื้อ</button>
</form>
</div>
</div>

<script>
var API_URL="api.php";
var products=[];
var cart=[];
var currentUser=null;
var pendingRegisterEmail="";
var currentPage="productPage";
var previousPage="productPage";

try{
cart=JSON.parse(localStorage.getItem("betagen_cart")||"[]");
if(!Array.isArray(cart)){cart=[]}
}catch(e){cart=[]}

function api(action,data,callback){
var xhr=new XMLHttpRequest();
xhr.open("POST",API_URL,true);
xhr.setRequestHeader("Content-Type","application/json;charset=UTF-8");
xhr.onreadystatechange=function(){
if(xhr.readyState!==4)return;
var result=null;
try{result=JSON.parse(xhr.responseText)}catch(e){
callback({ok:false,message:"เซิร์ฟเวอร์ส่งข้อมูลไม่ถูกต้อง"},xhr.status);
return;
}
callback(result,xhr.status);
};
xhr.onerror=function(){callback({ok:false,message:"ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้"},0)};
data=data||{};
data.action=action;
xhr.send(JSON.stringify(data));
}

function saveCart(){
localStorage.setItem("betagen_cart",JSON.stringify(cart));
updateCartCount();
}

function escapeHtml(value){
return String(value===null||value===undefined?"":value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function money(value){
return Number(value||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2})+" บาท";
}

function findProduct(id){
for(var i=0;i<products.length;i++){
if(Number(products[i].id)===Number(id))return products[i];
}
return null;
}

function updateCartCount(){
var count=0;
for(var i=0;i<cart.length;i++)count+=Number(cart[i].quantity||0);
document.getElementById("cartCount").textContent=count;
}

function loadProducts(){
api("products",{},function(result){
if(!result.ok){
document.getElementById("productList").innerHTML='<div class="empty">'+escapeHtml(result.message||"โหลดสินค้าไม่สำเร็จ")+"</div>";
return;
}
products=result.products||[];
renderProducts();
renderCart();
});
}

function renderProducts(){
var el=document.getElementById("productList");
if(!products.length){
el.innerHTML='<div class="empty">ยังไม่มีสินค้า</div>';
return;
}
var html="";
for(var i=0;i<products.length;i++){
var p=products[i];
var image=p.image_url?'<img src="'+escapeHtml(p.image_url)+'" alt="'+escapeHtml(p.name)+'">':escapeHtml((p.name||"B").charAt(0));
html+='<div class="product-card">';
html+='<div class="product-image">'+image+"</div>";
html+='<div class="product-info">';
html+='<div class="product-name">'+escapeHtml(p.name)+"</div>";
html+='<div class="product-price">'+money(p.price)+"</div>";
html+='<button class="primary full" onclick="addToCart('+Number(p.id)+')">เพิ่มลงตะกร้า</button>';
html+="</div></div>";
}
el.innerHTML=html;
}

function addToCart(id){
var product=findProduct(id);
if(!product){
alert("ไม่พบสินค้า");
return;
}
var found=null;
for(var i=0;i<cart.length;i++){
if(Number(cart[i].product_id)===Number(id)){found=cart[i];break}
}
if(found){
found.quantity=Number(found.quantity)+1;
}else{
cart.push({product_id:Number(id),quantity:1});
}
saveCart();
alert("เพิ่ม "+product.name+" ลงตะกร้าแล้ว");
}

function renderCart(){
var el=document.getElementById("cartContent");
if(!cart.length){
el.innerHTML='<div class="empty">ยังไม่มีสินค้าในตะกร้า<br><br><button class="primary" onclick="showProducts()">เลือกสินค้า</button></div>';
return;
}

var total=0;
var html='<div class="cart-layout"><div class="cart-list">';

for(var i=0;i<cart.length;i++){
var item=cart[i];
var p=findProduct(item.product_id);
if(!p)continue;

var qty=Number(item.quantity);
var line=Number(p.price)*qty;
total+=line;

var image=p.image_url?'<img src="'+escapeHtml(p.image_url)+'" alt="'+escapeHtml(p.name)+'">':escapeHtml((p.name||"B").charAt(0));

html+='<div class="cart-item">';
html+='<div class="cart-item-image">'+image+"</div>";
html+='<div class="cart-item-main">';
html+='<div class="cart-item-name">'+escapeHtml(p.name)+"</div>";
html+='<div class="cart-item-price">'+money(p.price)+" / ชิ้น</div>";
html+="</div>";
html+='<div class="qty">';
html+='<button onclick="changeQuantity('+Number(p.id)+',-1)">−</button>';
html+='<span>'+qty+"</span>";
html+='<button onclick="changeQuantity('+Number(p.id)+',1)">+</button>';
html+="</div>";
html+='<button class="danger" onclick="removeFromCart('+Number(p.id)+')">ลบ</button>';
html+="</div>";
}

html+='</div>';
html+='<div class="cart-summary">';
html+='<div class="summary-row"><span>จำนวนสินค้า</span><span>'+cartItemCount()+" ชิ้น</span></div>";
html+='<div class="summary-row"><span>ยอดรวม</span><span>'+money(total)+"</span></div>";
html+='<div class="summary-total">รวมทั้งหมด '+money(total)+"</div>";
html+='<br><button class="primary full" onclick="checkout()">ดำเนินการสั่งซื้อ</button>';
html+="</div></div>";

el.innerHTML=html;
}

function cartItemCount(){
var n=0;
for(var i=0;i<cart.length;i++)n+=Number(cart[i].quantity||0);
return n;
}

function changeQuantity(id,delta){
for(var i=0;i<cart.length;i++){
if(Number(cart[i].product_id)===Number(id)){
cart[i].quantity=Number(cart[i].quantity)+delta;
if(cart[i].quantity<=0)cart.splice(i,1);
break;
}
}
saveCart();
renderCart();
}

function removeFromCart(id){
var next=[];
for(var i=0;i<cart.length;i++){
if(Number(cart[i].product_id)!==Number(id))next.push(cart[i]);
}
cart=next;
saveCart();
renderCart();
}

function hideAllPages(){
document.getElementById("productPage").classList.remove("active");
document.getElementById("cartPage").classList.remove("active");
document.getElementById("accountPage").classList.remove("active");
}

function showPage(id){
previousPage=currentPage;
currentPage=id;
hideAllPages();
document.getElementById(id).classList.add("active");
window.scrollTo(0,0);
}

function showProducts(){
showPage("productPage");
}

function showCart(){
renderCart();
showPage("cartPage");
}

function openAccount(){
loadCurrentUser(function(){
renderAccount();
showPage("accountPage");
});
}

function goBackPage(){
if(currentPage==="cartPage"||currentPage==="accountPage")showProducts();
else showProducts();
}

function checkout(){
if(!cart.length){
alert("ยังไม่มีสินค้าในตะกร้า");
return;
}
if(!currentUser){
openAuth("login");
return;
}
var today=new Date();
var yyyy=today.getFullYear();
var mm=String(today.getMonth()+1).padStart(2,"0");
var dd=String(today.getDate()).padStart(2,"0");
document.getElementById("checkoutDate").min=yyyy+"-"+mm+"-"+dd;
document.getElementById("checkoutName").value="";
document.getElementById("checkoutPhone").value="";
document.getElementById("checkoutAddress").value="";
document.getElementById("checkoutProvince").value="";
document.getElementById("checkoutDistrict").value="";
document.getElementById("checkoutSubdistrict").value="";
document.getElementById("checkoutDate").value="";
document.getElementById("checkoutRound").value="1";
document.getElementById("checkoutPayment").value="cod";

var total=0;
for(var i=0;i<cart.length;i++){
var p=findProduct(cart[i].product_id);
if(p)total+=Number(p.price)*Number(cart[i].quantity);
}
document.getElementById("checkoutTotal").textContent="ยอดสั่งซื้อ: "+money(total);
document.getElementById("checkoutOverlay").classList.add("show");
}

function closeCheckout(){
document.getElementById("checkoutOverlay").classList.remove("show");
}

function createOrder(event){
event.preventDefault();

var date=document.getElementById("checkoutDate").value;
var dateObj=new Date(date+"T00:00:00");

if(dateObj.getDay()===0){
alert("ไม่สามารถเลือกวันอาทิตย์ได้");
return;
}

var items=[];
for(var i=0;i<cart.length;i++){
items.push({
product_id:Number(cart[i].product_id),
quantity:Number(cart[i].quantity)
});
}

api("create_order",{
customer_name:document.getElementById("checkoutName").value.trim(),
phone:document.getElementById("checkoutPhone").value.trim(),
address:document.getElementById("checkoutAddress").value.trim(),
province:document.getElementById("checkoutProvince").value.trim(),
district:document.getElementById("checkoutDistrict").value.trim(),
subdistrict:document.getElementById("checkoutSubdistrict").value.trim(),
delivery_date:date,
round_no:Number(document.getElementById("checkoutRound").value),
payment:document.getElementById("checkoutPayment").value,
items:items
},function(result){
if(!result.ok){
alert(result.message||"สั่งซื้อไม่สำเร็จ");
return;
}

cart=[];
saveCart();
closeCheckout();

alert("สั่งซื้อสำเร็จ\nเลขที่คำสั่งซื้อ: "+(result.order_no||"-")+"\nยอดรวม: "+money(result.total));

openAccount();
});
}

function openAuth(type){
document.getElementById("authOverlay").classList.add("show");
switchAuth(type||"login");
}

function closeAuth(){
document.getElementById("authOverlay").classList.remove("show");
}

function switchAuth(type){
var login=type==="login";
document.getElementById("loginForm").classList.toggle("hidden",!login);
document.getElementById("registerForm").classList.toggle("hidden",login);
document.getElementById("loginTab").classList.toggle("active",login);
document.getElementById("registerTab").classList.toggle("active",!login);
}

function registerRequest(event){
event.preventDefault();

var email=document.getElementById("registerEmail").value.trim().toLowerCase();
var password=document.getElementById("registerPassword").value;
var password2=document.getElementById("registerPassword2").value;

if(password!==password2){
alert("รหัสผ่านไม่ตรงกัน");
return;
}

api("register_request",{
email:email,
password:password
},function(result){
if(!result.ok){
alert(result.message||"สมัครสมาชิกไม่สำเร็จ");
return;
}

pendingRegisterEmail=email;
document.getElementById("otpCode").value="";
closeAuth();
document.getElementById("otpOverlay").classList.add("show");
});
}

function registerVerify(event){
event.preventDefault();

var email=pendingRegisterEmail||document.getElementById("registerEmail").value.trim().toLowerCase();
var code=document.getElementById("otpCode").value.trim();

api("register_verify",{
email:email,
code:code
},function(result){
if(!result.ok){
alert(result.message||"OTP ไม่ถูกต้อง");
return;
}

currentUser=result.user||null;
document.getElementById("otpOverlay").classList.remove("show");
alert("สมัครสมาชิกสำเร็จ");
openAccount();
});
}

function closeOtp(){
document.getElementById("otpOverlay").classList.remove("show");
}

function login(event){
event.preventDefault();

api("login",{
email:document.getElementById("loginEmail").value.trim().toLowerCase(),
password:document.getElementById("loginPassword").value
},function(result){
if(!result.ok){
alert(result.message||"เข้าสู่ระบบไม่สำเร็จ");
return;
}

currentUser=result.user||null;
closeAuth();
alert("เข้าสู่ระบบสำเร็จ");
openAccount();
});
}

function logout(){
api("logout",{},function(result){
currentUser=null;
if(!result.ok){
alert(result.message||"ออกจากระบบไม่สำเร็จ");
return;
}
renderAccount();
showProducts();
});
}

function loadCurrentUser(callback){
api("me",{},function(result){
if(result.ok&&result.user){
currentUser=result.user;
}else{
currentUser=null;
}
if(callback)callback(currentUser);
});
}

function renderAccount(){
var el=document.getElementById("accountContent");

if(!currentUser){
el.innerHTML=
'<div class="account-card">'+
'<h2>ยินดีต้อนรับ</h2>'+
'<p class="note">เข้าสู่ระบบเพื่อสั่งซื้อสินค้า ดูคำสั่งซื้อ และเปิดใช้งาน Seller</p>'+
'<div class="account-actions">'+
'<button class="primary" onclick="openAuth(\'login\')">เข้าสู่ระบบ</button>'+
'<button class="secondary" onclick="openAuth(\'register\')">สมัครสมาชิก</button>'+
"</div></div>";
return;
}

var sellerText=Number(currentUser.is_seller)===1?"Seller เปิดใช้งานแล้ว":"ลูกค้า";

var html=
'<div class="account-card">'+
'<div class="account-email">'+escapeHtml(currentUser.email)+'</div>'+
'<div class="account-role">'+sellerText+'</div>'+
'<div class="account-actions">';

if(Number(currentUser.is_seller)!==1){
html+='<button class="primary" onclick="enableSeller()">เปิดใช้งาน Seller</button>';
}

html+='<button class="secondary" onclick="loadOrders()">คำสั่งซื้อของฉัน</button>';
html+='<button class="secondary" onclick="logout()">ออกจากระบบ</button>';
html+="</div></div>";

if(Number(currentUser.is_seller)===1){
html+='<div class="account-card" id="sellerPanel"><h2>ระบบ Seller</h2><div id="sellerPanelContent">กำลังโหลด...</div></div>';
}

html+='<div class="account-card"><h2>คำสั่งซื้อ</h2><div id="ordersContent"><div class="note">กด "คำสั่งซื้อของฉัน" เพื่อโหลดรายการ</div></div></div>';

el.innerHTML=html;

if(Number(currentUser.is_seller)===1)loadSellerPanel();
}

function enableSeller(){
api("enable_seller",{},function(result){
if(!result.ok){
alert(result.message||"เปิด Seller ไม่สำเร็จ");
return;
}
currentUser=result.user;
renderAccount();
});
}

function loadSellerPanel(){
api("seller_areas",{},function(areaResult){
if(!areaResult.ok){
document.getElementById("sellerPanelContent").innerHTML='<div class="alert">'+escapeHtml(areaResult.message||"โหลดพื้นที่ไม่สำเร็จ")+"</div>";
return;
}

api("seller_routes",{},function(routeResult){
var areas=areaResult.areas||[];
var routes=routeResult.ok?(routeResult.routes||[]):[];

var html=
'<div class="alert">กำหนดพื้นที่และรอบส่งของ Seller ได้จากด้านล่าง</div>'+
'<h3>เพิ่มพื้นที่</h3>'+
'<div class="form-grid">'+
'<div class="field"><label>จังหวัด</label><input id="sellerProvince"></div>'+
'<div class="field"><label>อำเภอ</label><input id="sellerDistrict"></div>'+
'<div class="field"><label>ตำบล</label><input id="sellerSubdistrict"></div>'+
"</div><br>"+
'<button class="primary" onclick="saveSellerArea()">เพิ่มพื้นที่</button>'+
'<div id="sellerAreaList">';

if(!areas.length){
html+='<div class="note" style="margin-top:15px">ยังไม่มีพื้นที่</div>';
}else{
for(var i=0;i<areas.length;i++){
var a=areas[i];
html+='<div class="seller-area">';
html+='<div class="item-header"><div><strong>'+escapeHtml(a.province)+"</strong><br>"+escapeHtml(a.district)+" / "+escapeHtml(a.subdistrict)+"</div>";
html+='<button class="danger" onclick="deleteSellerArea('+Number(a.id)+')">ลบ</button></div>';
html+="</div>";
}
}

html+="</div>";
html+='<h3 style="margin-top:25px">เพิ่มรอบส่ง</h3>';

html+='<div class="form-grid">'+
'<div class="field"><label>พื้นที่</label><select id="sellerAreaSelect">';

for(var j=0;j<areas.length;j++){
html+='<option value="'+Number(areas[j].id)+'">'+escapeHtml(areas[j].province)+" / "+escapeHtml(areas[j].district)+" / "+escapeHtml(areas[j].subdistrict)+"</option>";
}

html+='</select></div>'+
'<div class="field"><label>วัน</label><select id="sellerDay">'+
'<option value="1">จันทร์</option>'+
'<option value="2">อังคาร</option>'+
'<option value="3">พุธ</option>'+
'<option value="4">พฤหัสบดี</option>'+
'<option value="5">ศุกร์</option>'+
'<option value="6">เสาร์</option>'+
"</select></div>"+
'<div class="field"><label>รอบ</label><select id="sellerRound">'+
'<option value="1">รอบ 1</option>'+
'<option value="2">รอบ 2</option>'+
'<option value="3">รอบ 3</option>'+
'<option value="4">รอบ 4</option>'+
'<option value="5">รอบ 5</option>'+
"</select></div></div><br>";

if(areas.length){
html+='<button class="primary" onclick="saveSellerRoute()">เพิ่มรอบส่ง</button>';
}else{
html+='<div class="note">ต้องเพิ่มพื้นที่ก่อนจึงจะเพิ่มรอบส่งได้</div>';
}

html+='<h3 style="margin-top:25px">รอบส่งของฉัน</h3>';

if(!routes.length){
html+='<div class="note">ยังไม่มีรอบส่ง</div>';
}else{
for(var r=0;r<routes.length;r++){
var route=routes[r];
html+='<div class="route-item">';
html+='<div class="item-header"><div><strong>'+escapeHtml(dayName(route.day_of_week))+" · รอบ "+Number(route.round_no)+"</strong><br>";
html+=escapeHtml(route.province)+" / "+escapeHtml(route.district)+" / "+escapeHtml(route.subdistrict);
html+='</div><button class="danger" onclick="deleteSellerRoute('+Number(route.id)+')">ลบ</button></div>';
html+="</div>";
}
}

document.getElementById("sellerPanelContent").innerHTML=html;
});
});
}

function dayName(day){
var names={
1:"จันทร์",
2:"อังคาร",
3:"พุธ",
4:"พฤหัสบดี",
5:"ศุกร์",
6:"เสาร์",
7:"อาทิตย์"
};
return names[Number(day)]||"-";
}

function saveSellerArea(){
api("seller_area_save",{
province:document.getElementById("sellerProvince").value.trim(),
district:document.getElementById("sellerDistrict").value.trim(),
subdistrict:document.getElementById("sellerSubdistrict").value.trim()
},function(result){
if(!result.ok){
alert(result.message||"เพิ่มพื้นที่ไม่สำเร็จ");
return;
}
loadSellerPanel();
});
}

function deleteSellerArea(id){
if(!confirm("ต้องการลบพื้นที่นี้หรือไม่"))return;

api("seller_area_delete",{area_id:id},function(result){
if(!result.ok){
alert(result.message||"ลบพื้นที่ไม่สำเร็จ");
return;
}
loadSellerPanel();
});
}

function saveSellerRoute(){
var area=document.getElementById("sellerAreaSelect");
if(!area||!area.value){
alert("กรุณาเลือกพื้นที่");
return;
}

api("seller_route_save",{
area_id:Number(area.value),
day_of_week:Number(document.getElementById("sellerDay").value),
round_no:Number(document.getElementById("sellerRound").value)
},function(result){
if(!result.ok){
alert(result.message||"เพิ่มรอบส่งไม่สำเร็จ");
return;
}
loadSellerPanel();
});
}

function deleteSellerRoute(id){
if(!confirm("ต้องการลบรอบส่งนี้หรือไม่"))return;

api("seller_route_delete",{route_id:id},function(result){
if(!result.ok){
alert(result.message||"ลบรอบส่งไม่สำเร็จ");
return;
}
loadSellerPanel();
});
}

function loadOrders(){
if(!currentUser){
openAuth("login");
return;
}

api("my_orders",{},function(result){
if(!result.ok){
alert(result.message||"โหลดคำสั่งซื้อไม่สำเร็จ");
return;
}

var el=document.getElementById("ordersContent");
var orders=result.orders||[];

if(!orders.length){
el.innerHTML='<div class="note">ยังไม่มีคำสั่งซื้อ</div>';
return;
}

var html="";

for(var i=0;i<orders.length;i++){
var o=orders[i];
var items=[];

try{
items=JSON.parse(o.items_json||"[]");
}catch(e){items=[]}

html+='<div class="order-card">';
html+='<div class="item-header">';
html+='<div><strong>เลขที่ '+escapeHtml(o.order_no)+'</strong><br><span class="note">'+escapeHtml(o.created_at||"")+"</span></div>";
html+='<span class="order-status">'+escapeHtml(o.status||"pending")+"</span>";
html+="</div>";

html+='<div style="margin-top:12px">';
for(var j=0;j<items.length;j++){
html+='<div>'+escapeHtml(items[j].name||"สินค้า")+" × "+Number(items[j].quantity||0)+"</div>";
}
html+="</div>";

html+='<div class="note" style="margin-top:10px">จัดส่ง '+escapeHtml(o.delivery_date||"-")+" · "+escapeHtml(dayName(o.day_of_week))+" · รอบ "+Number(o.round_no||0)+"</div>";
html+='<div class="note">ชำระเงิน: '+(o.payment==="transfer"?"โอนเงิน":"เก็บเงินปลายทาง")+"</div>";
html+='<div class="order-total">'+money(o.total_amount)+"</div>";
html+="</div>";
}

el.innerHTML=html;
});
}

document.getElementById("checkoutDate").addEventListener("change",function(){
var value=this.value;
if(!value)return;
var date=new Date(value+"T00:00:00");
if(date.getDay()===0){
alert("ไม่สามารถเลือกวันอาทิตย์ได้");
this.value="";
}
});

updateCartCount();
loadProducts();
loadCurrentUser(function(){});
</script>

</body>
</html>
