<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>APP BETAGEN</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f172a;color:#fff;font-family:Arial,sans-serif}
button,input,select{font:inherit}
.wrap{max-width:900px;margin:auto;padding:20px}
.card{background:#111c31;border:1px solid #24314a;border-radius:20px;padding:18px;margin:12px 0}
h1,h2,h3{margin-top:0}
input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #334155;background:#0b1220;color:#fff;margin:7px 0}
button{border:0;border-radius:12px;padding:13px 16px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;margin:4px}
button.secondary{background:#334155}
button.danger{background:#dc2626}
.row{display:flex;gap:8px;flex-wrap:wrap}
.hidden{display:none!important}
.small{color:#94a3b8;font-size:13px}
.product{display:flex;justify-content:space-between;align-items:center;gap:12px}
.price{font-weight:800}
.area{padding:14px;border:1px solid #334155;border-radius:14px;margin:10px 0}
.route{display:inline-flex;gap:5px;align-items:center;background:#17243b;border-radius:9px;padding:7px 9px;margin:3px;font-size:13px}
.list{margin:8px 0;padding-left:20px}
</style>
</head>
<body>
<div class="wrap">
<h1>APP BETAGEN</h1>

<section id="auth">
<div class="card">
<h2>สมัครสมาชิก</h2>
<input id="regEmail" type="email" placeholder="อีเมล์">
<input id="regPassword" type="password" placeholder="รหัสผ่าน">
<button onclick="registerRequest()">ส่ง OTP</button>
<input id="regOtp" class="hidden" maxlength="6" placeholder="OTP ที่ได้รับทางอีเมล์">
<button id="regVerifyBtn" class="hidden" onclick="registerVerify()">ยืนยัน OTP</button>
</div>

<div class="card">
<h2>เข้าสู่ระบบ</h2>
<input id="loginEmail" type="email" placeholder="อีเมล์">
<input id="loginPassword" type="password" placeholder="รหัสผ่าน">
<button onclick="login()">เข้าสู่ระบบ</button>
</div>
</section>

<section id="app" class="hidden">
<div class="card">
<div class="row">
<button onclick="show('home')">หน้าแรก</button>
<button onclick="show('profile')">โปรไฟล์</button>
<button onclick="show('shop')">สินค้า</button>
<button class="secondary" onclick="logout()">ออกจากระบบ</button>
</div>
</div>

<div id="home">
<div class="card">
<h2>APP BETAGEN</h2>
<p>ระบบสั่งซื้อสินค้าและจัดการรอบวิ่งเซลล์</p>
</div>
</div>

<div id="profile" class="hidden">
<div class="card">
<h2>โปรไฟล์</h2>
<div id="profileInfo"></div>
<button id="sellerButton" onclick="enableSeller()">เซลล์</button>
</div>

<div id="sellerPanel" class="card hidden">
<h2>ตั้งค่าพื้นที่วิ่ง</h2>
<input id="province" placeholder="จังหวัด">
<input id="district" placeholder="อำเภอ">
<input id="subdistrict" placeholder="ตำบล">
<button onclick="saveArea()">เพิ่มพื้นที่</button>
<div id="areas"></div>
</div>
</div>

<div id="shop" class="hidden">
<div class="card">
<h2>สินค้า</h2>
<div id="products"></div>
</div>

<div class="card">
<h2>ตะกร้า</h2>
<div id="cart"></div>
</div>

<div id="checkout" class="card hidden">
<h2>สั่งซื้อ</h2>
<input id="customerName" placeholder="ชื่อผู้รับ">
<input id="customerPhone" placeholder="เบอร์โทร">
<input id="orderProvince" placeholder="จังหวัด">
<input id="orderDistrict" placeholder="อำเภอ">
<input id="orderSubdistrict" placeholder="ตำบล">
<input id="deliveryDate" type="date">
<select id="roundNo">
<option value="">เลือกรอบ</option>
<option value="1">รอบที่ 1</option>
<option value="2">รอบที่ 2</option>
<option value="3">รอบที่ 3</option>
<option value="4">รอบที่ 4</option>
<option value="5">รอบที่ 5</option>
</select>
<select id="paymentMethod">
<option value="เก็บเงินปลายทาง">เก็บเงินปลายทาง</option>
<option value="โอนเงิน">โอนเงิน</option>
</select>
<button onclick="createOrder()">ยืนยันสั่งซื้อ</button>
</div>
</div>
</section>
</div>

<script>
var API='api.php';
var cart=[];

function $(id){return document.getElementById(id)}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
function post(action,data){
 return fetch(API+'?action='+encodeURIComponent(action),{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify(data||{})
 }).then(function(r){return r.json()})
}
function show(id){
 ['home','profile','shop'].forEach(function(x){$(x).classList.add('hidden')});
 $(id).classList.remove('hidden');
 if(id==='profile') loadProfile();
 if(id==='shop') loadProducts();
}
function boot(){
 fetch(API+'?action=me').then(function(r){return r.json()}).then(function(x){
  if(x.user){$('auth').classList.add('hidden');$('app').classList.remove('hidden');loadProfile()}
 });
}
function registerRequest(){
 post('register_request',{email:$('regEmail').value,password:$('regPassword').value}).then(function(x){
  alert(x.message);
  if(x.ok){$('regOtp').classList.remove('hidden');$('regVerifyBtn').classList.remove('hidden')}
 });
}
function registerVerify(){
 post('register_verify',{otp:$('regOtp').value}).then(function(x){
  alert(x.message);
  if(x.ok){$('auth').classList.add('hidden');$('app').classList.remove('hidden');loadProfile()}
 });
}
function login(){
 post('login',{email:$('loginEmail').value,password:$('loginPassword').value}).then(function(x){
  alert(x.message);
  if(x.ok){$('auth').classList.add('hidden');$('app').classList.remove('hidden');loadProfile()}
 });
}
function logout(){
 fetch(API+'?action=logout').then(function(){
  $('app').classList.add('hidden');$('auth').classList.remove('hidden');
 });
}
function loadProfile(){
 fetch(API+'?action=me').then(function(r){return r.json()}).then(function(x){
  if(!x.user)return;
  $('profileInfo').innerHTML='<p>อีเมล์: '+esc(x.user.email)+'</p><p>สถานะ: '+(Number(x.user.is_seller)?'เซลล์':'ผู้ใช้')+'</p>';
  if(Number(x.user.is_seller)){
   $('sellerButton').classList.add('hidden');
   $('sellerPanel').classList.remove('hidden');
   loadAreas();
  }else{
   $('sellerButton').classList.remove('hidden');
   $('sellerPanel').classList.add('hidden');
  }
 });
}
function enableSeller(){
 post('enable_seller',{}).then(function(x){alert(x.message);if(x.ok)loadProfile()});
}
function saveArea(){
 post('seller_area_save',{
  province:$('province').value,
  district:$('district').value,
  subdistrict:$('subdistrict').value
 }).then(function(x){
  alert(x.message);
  if(x.ok){
   $('province').value='';$('district').value='';$('subdistrict').value='';
   loadAreas();
  }
 });
}
function dayName(n){
 return ['','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'][Number(n)]||'';
}
function loadAreas(){
 fetch(API+'?action=seller_areas').then(function(r){return r.json()}).then(function(x){
  if(!x.ok)return;
  var html='';
  x.areas.forEach(function(a){
   html+='<div class="area">';
   html+='<b>'+esc(a.province)+' / '+esc(a.district)+' / '+esc(a.subdistrict)+'</b>';
   html+='<button class="danger" onclick="deleteArea('+a.id+')">ลบพื้นที่</button>';
   html+='<div class="row">';
   html+='<select id="day_'+a.id+'"><option value="1">จันทร์</option><option value="2">อังคาร</option><option value="3">พุธ</option><option value="4">พฤหัสบดี</option><option value="5">ศุกร์</option><option value="6">เสาร์</option></select>';
   html+='<select id="round_'+a.id+'"><option value="1">รอบ 1</option><option value="2">รอบ 2</option><option value="3">รอบ 3</option><option value="4">รอบ 4</option><option value="5">รอบ 5</option></select>';
   html+='<button onclick="addRoute('+a.id+')">เพิ่มรอบวิ่ง</button>';
   html+='</div>';
   if(a.routes.length){
    html+='<div>';
    a.routes.forEach(function(r){
     html+='<span class="route">'+dayName(r.day_of_week)+' / รอบ '+r.round_no+' <button class="danger" onclick="deleteRoute('+r.id+')">×</button></span>';
    });
    html+='</div>';
   }else html+='<p class="small">ยังไม่ได้กำหนดวันวิ่ง</p>';
   html+='</div>';
  });
  $('areas').innerHTML=html||'<p class="small">ยังไม่มีพื้นที่</p>';
 });
}
function addRoute(areaId){
 post('seller_route_save',{
  area_id:areaId,
  day_of_week:Number($('day_'+areaId).value),
  round_no:Number($('round_'+areaId).value)
 }).then(function(x){alert(x.message);if(x.ok)loadAreas()});
}
function deleteRoute(id){
 post('seller_route_delete',{id:id}).then(function(x){if(x.ok)loadAreas()});
}
function deleteArea(id){
 if(!confirm('ลบพื้นที่นี้หรือไม่'))return;
 post('seller_area_delete',{id:id}).then(function(x){if(x.ok)loadAreas()});
}
function loadProducts(){
 fetch(API+'?action=products').then(function(r){return r.json()}).then(function(x){
  if(!x.ok)return;
  var html='';
  x.products.forEach(function(p){
   html+='<div class="card product"><div><b>'+esc(p.name)+'</b><div class="price">'+Number(p.price).toFixed(2)+' บาท</div></div><button onclick="addCart('+p.id+',\''+esc(p.name).replace(/'/g,"\\'")+'\','+p.price+')">เพิ่ม</button></div>';
  });
  $('products').innerHTML=html;
  renderCart();
 });
}
function addCart(id,name,price){
 var found=cart.find(function(x){return x.id===id});
 if(found)found.quantity++;
 else cart.push({id:id,name:name,price:Number(price),quantity:1});
 renderCart();
}
function renderCart(){
 var html='',total=0;
 cart.forEach(function(x){
  var sub=x.price*x.quantity;total+=sub;
  html+='<div class="product"><span>'+esc(x.name)+' x '+x.quantity+'</span><span>'+sub.toFixed(2)+' บาท <button onclick="removeCart('+x.id+')">ลบ</button></span></div>';
 });
 $('cart').innerHTML=html||'<p class="small">ยังไม่มีสินค้า</p>';
 if(cart.length){
  $('cart').innerHTML+='<h3>รวม '+total.toFixed(2)+' บาท</h3><button onclick="openCheckout()">ไปชำระเงิน</button>';
 }
}
function removeCart(id){
 cart=cart.filter(function(x){return x.id!==id});
 renderCart();
}
function openCheckout(){
 $('checkout').classList.remove('hidden');
 $('checkout').scrollIntoView({behavior:'smooth'});
}
function createOrder(){
 var date=$('deliveryDate').value;
 var d=new Date(date+'T00:00:00');
 var day=d.getDay();
 if(day===0){alert('วันอาทิตย์ไม่มีรอบวิ่ง');return}
 var total=0;
 cart.forEach(function(x){x.subtotal=x.price*x.quantity;total+=x.subtotal});
 post('create_order',{
  customer_name:$('customerName').value,
  customer_phone:$('customerPhone').value,
  province:$('orderProvince').value,
  district:$('orderDistrict').value,
  subdistrict:$('orderSubdistrict').value,
  delivery_date:date,
  round_no:Number($('roundNo').value),
  payment_method:$('paymentMethod').value,
  total:total,
  items:cart
 }).then(function(x){
  alert(x.ok?'สั่งซื้อสำเร็จ เลขที่ '+x.order_no:x.message);
  if(x.ok){cart=[];renderCart();$('checkout').classList.add('hidden')}
 });
}
boot();
</script>
</body>
</html>
