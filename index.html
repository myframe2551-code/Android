<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>APP BETAGEN</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
    font-family:Arial,"Tahoma",sans-serif;
    background:#f4f7fb;
    color:#0f172a;
}

body{
    overflow-x:hidden;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.header{
    position:sticky;
    top:0;
    z-index:50;
    height:64px;
    background:#0f172a;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.logo{
    font-size:20px;
    font-weight:800;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.header-btn{
    background:#1e293b;
    color:white;
    border-radius:12px;
    padding:10px 13px;
    font-size:13px;
}

.header-btn:hover{
    background:#334155;
}

.cart-count{
    display:inline-flex;
    min-width:20px;
    height:20px;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#2563eb;
    font-size:11px;
    margin-left:4px;
}

.main{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:24px 16px 60px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.page-title{
    font-size:28px;
    font-weight:800;
    margin-bottom:8px;
}

.page-subtitle{
    color:#64748b;
    margin-bottom:22px;
}

.product-list{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.product-card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(15,23,42,.08);
    border:1px solid #e2e8f0;
}

.product-image{
    width:100%;
    height:210px;
    background:#e2e8f0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.product-image-placeholder{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    text-align:center;
    font-size:20px;
    font-weight:800;
    color:#475569;
}

.product-info{
    padding:16px;
}

.product-name{
    font-size:18px;
    font-weight:800;
}

.product-detail{
    min-height:20px;
    margin-top:5px;
    color:#64748b;
    font-size:13px;
}

.product-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:16px;
}

.product-price{
    font-size:18px;
    font-weight:800;
}

.primary-btn{
    background:#2563eb;
    color:white;
    padding:11px 16px;
    border-radius:12px;
    font-weight:700;
}

.primary-btn:hover{
    background:#1d4ed8;
}

.secondary-btn{
    background:#e2e8f0;
    color:#0f172a;
    padding:11px 16px;
    border-radius:12px;
    font-weight:700;
}

.danger-btn{
    background:#fee2e2;
    color:#b91c1c;
    padding:9px 13px;
    border-radius:10px;
    font-weight:700;
}

.card{
    background:white;
    border:1px solid #e2e8f0;
    border-radius:20px;
    padding:20px;
    box-shadow:0 8px 25px rgba(15,23,42,.06);
    margin-bottom:16px;
}

.cart-item{
    display:flex;
    align-items:center;
    gap:15px;
    padding:15px 0;
    border-bottom:1px solid #e2e8f0;
}

.cart-item:last-child{
    border-bottom:0;
}

.cart-item-info{
    flex:1;
}

.cart-item-name{
    font-weight:800;
}

.cart-item-price{
    color:#64748b;
    font-size:13px;
    margin-top:4px;
}

.quantity-box{
    display:flex;
    align-items:center;
    gap:8px;
}

.quantity-btn{
    width:32px;
    height:32px;
    border-radius:9px;
    background:#e2e8f0;
    font-weight:800;
}

.quantity-number{
    min-width:28px;
    text-align:center;
    font-weight:800;
}

.cart-total{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:21px;
    font-weight:800;
    padding-top:18px;
}

.form-group{
    margin-bottom:15px;
}

.form-label{
    display:block;
    margin-bottom:7px;
    font-size:14px;
    font-weight:700;
}

.form-input,
.form-select,
.form-textarea{
    width:100%;
    border:1px solid #cbd5e1;
    background:white;
    border-radius:12px;
    padding:12px 13px;
    outline:none;
    font-size:14px;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

.form-textarea{
    min-height:90px;
    resize:vertical;
}

.grid-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.account-box{
    display:flex;
    align-items:center;
    gap:16px;
}

.account-icon{
    width:60px;
    height:60px;
    border-radius:18px;
    background:#dbeafe;
    color:#2563eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:800;
}

.account-email{
    font-weight:800;
}

.account-role{
    margin-top:4px;
    color:#64748b;
    font-size:13px;
}

.empty{
    text-align:center;
    padding:50px 20px;
    color:#64748b;
}

.order{
    border:1px solid #e2e8f0;
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
}

.order-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
}

.order-number{
    font-weight:800;
}

.status{
    border-radius:999px;
    padding:5px 10px;
    font-size:12px;
    font-weight:800;
    background:#dbeafe;
    color:#1d4ed8;
}

.order-row{
    color:#475569;
    font-size:14px;
    margin-top:5px;
}

.order-items{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid #e2e8f0;
}

.order-item{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:7px;
    font-size:14px;
}

.order-total{
    margin-top:12px;
    text-align:right;
    font-size:18px;
    font-weight:800;
}

.overlay{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(15,23,42,.65);
    align-items:center;
    justify-content:center;
    padding:15px;
}

.overlay.active{
    display:flex;
}

.modal{
    width:100%;
    max-width:480px;
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:24px;
    padding:24px;
    box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.modal-title{
    font-size:23px;
    font-weight:800;
    margin-bottom:6px;
}

.modal-subtitle{
    color:#64748b;
    font-size:14px;
    margin-bottom:20px;
}

.modal-actions{
    display:flex;
    gap:10px;
    justify-content:flex-end;
    margin-top:20px;
}

.tabs{
    display:flex;
    gap:8px;
    background:#f1f5f9;
    border-radius:13px;
    padding:5px;
    margin-bottom:20px;
}

.tab{
    flex:1;
    padding:10px;
    border-radius:9px;
    background:transparent;
    font-weight:700;
}

.tab.active{
    background:white;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.auth-panel{
    display:none;
}

.auth-panel.active{
    display:block;
}

.otp-box{
    display:flex;
    gap:8px;
}

.otp-box input{
    text-align:center;
    font-size:22px;
    letter-spacing:5px;
}

.seller-section{
    margin-top:20px;
}

.seller-area{
    border:1px solid #e2e8f0;
    border-radius:14px;
    padding:14px;
    margin-top:10px;
}

.seller-area-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.route-list{
    margin-top:12px;
}

.route-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 0;
    border-top:1px solid #e2e8f0;
}

.back-button{
    display:none;
    background:#1e293b;
    color:white;
    border-radius:10px;
    padding:8px 11px;
    margin-right:8px;
}

@media(max-width:800px){
    .product-list{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:560px){
    .header{
        padding:0 10px;
    }

    .logo{
        font-size:17px;
    }

    .header-btn{
        padding:8px 9px;
        font-size:12px;
    }

    .main{
        padding:18px 12px 50px;
    }

    .product-list{
        grid-template-columns:1fr;
    }

    .grid-2{
        grid-template-columns:1fr;
    }

    .product-image{
        height:230px;
    }

    .modal{
        padding:20px;
        border-radius:20px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        <button
            id="backButton"
            class="back-button"
            onclick="goBackPage()">
            ←
        </button>
        APP BETAGEN
    </div>

    <div class="header-actions">

        </button>

        <button

        </button>

</header>

<main class="main">

    <section

        class="page active">

        <h1 class="page-title">

        </h1>

        <p class="page-subtitle">
            เลือกสินค้า BetaGen ที่คุณต้องการ
        </p>

        <div
            id="productList"
            class="product-list">
        </div>

    </section>

    <section

        class="page">

        </div>

    <section

        <h1 class="page-title">

        </h1>

        <p class="page-subtitle">

        </div>

</main>

<div
    id="authOverlay"
    class="overlay">

    <div class="modal">

        <div class="modal-title">
            บัญชี APP BETAGEN
        </div>

        <div class="modal-subtitle">
            เข้าสู่ระบบหรือสร้างบัญชีใหม่
        </div>

        <div class="tabs">

            <button
                id="loginTab"
                class="tab active"
                onclick="switchAuth('login')">

            <button

            </button>

        </div>

        <div
            id="loginPanel"
            class="auth-panel active">

            <div class="form-group">
                <label class="form-label">

                </label>

                <input

                    class="form-input"
                    type="email"

            </div>

            <div class="form-group">

                    รหัสผ่าน

                <input
                    id="loginPassword"

                    autocomplete="current-password">

            <div class="form-group">
                <label class="form-label">
                    อีเมล
                </label>

                <input
                    id="registerEmail"
                    class="form-input"
                    type="email"
                    autocomplete="email">
            </div>

            <div class="form-group">
                <label class="form-label">
                    รหัสผ่าน
                </label>

                <input
                    id="registerPassword"
                    class="form-input"
                    type="password"
                    autocomplete="new-password">

            <div class="form-group">

            </button>

<script>

var API_URL = "api.php";

var products = [];

var cart = [];

var currentUser = null;

var registerEmail = "";

var currentPage = "productPage";

var previousPage = "";

try {
    cart = JSON.parse(
        localStorage.getItem("betagen_cart") || "[]"
    );

    if (!Array.isArray(cart)) {
        cart = [];
    }
} catch (e) {
    cart = [];
}

function api(action, data, callback) {

    var xhr =
        new XMLHttpRequest();

    xhr.open(
        "POST",
        API_URL,
        true
    );

    xhr.setRequestHeader(
        "Content-Type",
        "application/json;charset=UTF-8"
    );

    xhr.withCredentials = true;

    xhr.onreadystatechange = function() {

        if (xhr.readyState !== 4) {
            return;
        }

        var result = null;

        try {
            result =
                JSON.parse(
                    xhr.responseText
                );
        } catch (e) {

            callback(false, {
                ok:false,
                message:"เซิร์ฟเวอร์ส่งข้อมูลไม่ถูกต้อง"
            });

            return;
        }

        callback(
            xhr.status >= 200 &&
            xhr.status < 500,
            result
        );
    };

    xhr.onerror = function() {

        callback(false, {
            ok:false,
            message:"ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้"
        });
    };

    data = data || {};

    data.action = action;

    xhr.send(
        JSON.stringify(data)
    );
}

function escapeHtml(value) {

    value = String(
        value === undefined ||
        value === null
            ? ""
            : value
    );

    return value
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function saveCart() {

    localStorage.setItem(
        "betagen_cart",
        JSON.stringify(cart)
    );
}

function findProduct(id) {

    id = Number(id);

    for (
        var i = 0;
        i < products.length;
        i++
    ) {

        if (
            Number(products[i].id) === id
        ) {
            return products[i];
        }
    }

    return null;
}

function loadProducts(callback) {

    api(
        "products",
        {},
        function(networkOK,result) {

            if (
                !networkOK ||
                !result.ok
            ) {

                if (callback) {
                    callback(false);
                }

                return;
            }

            products = [];

            var list =
                result.products || [];

            for (
                var i = 0;
                i < list.length;
                i++
            ) {

                products.push({
                    id:Number(list[i].id),
                    name:list[i].name,
                    detail:"",
                    price:Number(list[i].price),
                    image:list[i].image_url || ""
                });
            }

            renderProducts();

            updateCartCount();

            if (callback) {
                callback(true);
            }
        }
    );
}

function renderProducts() {

    var container =
        document.getElementById(
            "productList"
        );

    if (!container) {
        return;
    }

    container.innerHTML = "";

    if (products.length === 0) {

        container.innerHTML =
            '<div class="card empty">' +
            'ไม่พบสินค้า' +
            '</div>';

        return;
    }

    for (
        var i = 0;
        i < products.length;
        i++
    ) {

        var product =
            products[i];

        var card =
            document.createElement("div");

        card.className =
            "product-card";

        var imageHtml;

        if (product.image) {

            imageHtml =
                '<img src="' +
                escapeHtml(product.image) +
                '" alt="' +
                escapeHtml(product.name) +
                '">';

        } else {

            imageHtml =
                '<div class="product-image-placeholder">' +
                escapeHtml(product.name) +

        card.innerHTML =
            '<div class="product-image">' +

            '<div class="product-info">' +

                        Number(product.price).toFixed(2) +
                        ' บาท' +

                    '<button class="primary-btn" onclick="addToCart(' +
                        Number(product.id) +
                    ')">' +
                        'เพิ่ม' +
                    '</button>' +
                '</div>' +
            '</div>';

        container.appendChild(card);
    }
}

function addToCart(productId) {

    var product =
        findProduct(productId);

    if (!product) {
        alert("ไม่พบสินค้า");
        return;
    }

    var found = false;

    for (
        var i = 0;
        i < cart.length;
        i++
    ) {

        if (
            Number(cart[i].id) ===
            Number(productId)
        ) {

            cart[i].quantity =
                Number(cart[i].quantity) + 1;

            found = true;

            break;
        }
    }

    if (!found) {

        cart.push({
            id:Number(productId),
            quantity:1
        });
    }

    saveCart();

    updateCartCount();

    renderCart();
}

function updateCartCount() {

    var total = 0;

    for (
        var i = 0;
        i < cart.length;
        i++
    ) {

        total +=
            Number(cart[i].quantity) || 0;
    }

    var element =
        document.getElementById(
            "cartCount"
        );

    if (element) {
        element.textContent =
            total;
    }
}

function renderCart() {

    var container =
        document.getElementById(
            "cartContent"
        );

    if (!container) {
        return;
    }

    if (cart.length === 0) {

        container.innerHTML =
            '<div class="card empty">' +
            'ยังไม่มีสินค้าในตะกร้า' +
            '</div>';

        return;
    }

    var html = "";

    var total = 0;

    for (
        var i = 0;
        i < cart.length;
        i++
    ) {

        var item = cart[i];

        var product =
            findProduct(item.id);

        if (!product) {
            continue;
        }

        var quantity =
            Number(item.quantity);

        var lineTotal =
            product.price * quantity;

        total += lineTotal;

        html +=
            '<div class="cart-item">' +

                '<div class="cart-item-info">' +

                    '<div class="cart-item-name">' +
                        escapeHtml(product.name) +
                    '</div>' +

                    '<div class="cart-item-price">' +
                        Number(product.price).toFixed(2) +
                        ' บาท / ชิ้น' +
                    '</div>' +

                '</div>' +

                '<div class="quantity-box">' +

                    '<button class="quantity-btn" onclick="changeQuantity(' +
                        Number(product.id) +
                        ',-1)">−</button>' +

                    '<div class="quantity-number">' +
                        quantity +
                    '</div>' +

                    '<button class="quantity-btn" onclick="changeQuantity(' +
                        Number(product.id) +
                        ',1)">+</button>' +

                '</div>' +

                '<div style="font-weight:800;min-width:90px;text-align:right">' +
                    lineTotal.toFixed(2) +
                    ' ฿' +
                '</div>' +

                '<button class="danger-btn" onclick="removeFromCart(' +
                    Number(product.id) +
                ')">' +
                    'ลบ' +
                '</button>' +

            '</div>';
    }

    html +=
        '<div class="cart-total">' +
            '<span>รวม</span>' +
            '<span>' +
                total.toFixed(2) +
                ' บาท' +
            '</span>' +
        '</div>' +

        '<div style="display:flex;justify-content:flex-end;margin-top:18px">' +

            '<button class="primary-btn" onclick="checkout()">' +
                'ดำเนินการสั่งซื้อ' +
            '</button>' +

        '</div>';

    container.innerHTML =
        '<div class="card">' +
            html +
        '</div>';
}

function changeQuantity(
    productId,
    change
) {

    for (
        var i = 0;
        i < cart.length;
        i++
    ) {

        if (
            Number(cart[i].id) ===
            Number(productId)
        ) {

            cart[i].quantity =
                Number(cart[i].quantity) +
                Number(change);

            if (
                cart[i].quantity <= 0
            ) {
                cart.splice(i,1);
            }

            break;
        }
    }

    saveCart();

    updateCartCount();

    renderCart();
}

function removeFromCart(productId) {

    var next = [];

    for (
        var i = 0;
        i < cart.length;
        i++
    ) {

        if (
            Number(cart[i].id) !==
            Number(productId)
        ) {
            next.push(cart[i]);
        }
    }

    cart = next;

    saveCart();

    updateCartCount();

    renderCart();
}

function createOrder() {

    if (!currentUser) {
        openAuth();
        return;
    }

        return;
    }

    var customerName =
        document.getElementById(
            "customerName"
        ).value.trim();

    var phone =
        document.getElementById(
            "customerPhone"
        ).value.trim();

    var address =
        document.getElementById(
            "customerAddress"
        ).value.trim();

    var province =
        document.getElementById(
            "customerProvince"
        ).value.trim();

    var district =
        document.getElementById(
            "customerDistrict"
        ).value.trim();

    var subdistrict =
        document.getElementById(
            "customerSubdistrict"
        ).value.trim();

    var deliveryDate =
        document.getElementById(
            "deliveryDate"
        ).value;

    var roundNo =
        Number(
            document.getElementById(
                "deliveryRound"
            ).value
        );

    var payment =
        document.getElementById(
            "paymentMethod"
        ).value;

    if (
        !customerName ||
        !phone ||
        !address ||
        !province ||
        !district ||
        !subdistrict
    ) {

        alert(
            "กรุณากรอกข้อมูลให้ครบ"
        );

        return;
    }

    if (!deliveryDate) {

        alert(
            "กรุณาเลือกวันที่จัดส่ง"
        );

        return;
    }

    var date =
        new Date(
            deliveryDate + "T00:00:00"
        );

    if (
        date.getDay() === 0
    ) {

        alert(
            "ไม่สามารถจัดส่งวันอาทิตย์ได้"
        );

        return;
    }

    var items = [];

    for (
        var i = 0;
        i < cart.length;
        i++
    ) {

        var product =
            findProduct(
                cart[i].id
            );

        if (!product) {
            continue;
        }

        items.push({
            product_id:
                Number(product.id),

            quantity:
                Number(cart[i].quantity)
        });
    }

    api(
        "create_order",
        {
            customer_name:
                customerName,

            phone:
                phone,

            address:
                address,

            province:
                province,

            district:
                district,

            subdistrict:
                subdistrict,

            delivery_date:
                deliveryDate,

            round_no:
                roundNo,

            payment:
                payment,

            items:
                items
        },
        function(networkOK,result) {

            if (
                !networkOK ||
                !result.ok
            ) {

                alert(
                    result &&
                    result.message
                        ? result.message
                        : "สร้างคำสั่งซื้อไม่สำเร็จ"
                );

                return;
            }

            cart = [];

            saveCart();

            updateCartCount();

            closeCheckout();

            showProducts();

            alert(
                "สั่งซื้อสำเร็จ\n\n" +
                "เลขคำสั่งซื้อ: " +
                result.order_no +
                "\nยอดรวม: " +
                Number(
                    result.total
                ).toFixed(2) +
                " บาท"
            );
        }
    );

function switchAuth(type) {

    var loginPanel =
        document.getElementById(
            "loginPanel"
        );

    var registerPanel =
        document.getElementById(
            "registerPanel"
        );

    var loginTab =
        document.getElementById(
            "loginTab"
        );

    var registerTab =
        document.getElementById(
            "registerTab"
        );

    if (type === "login") {

        loginPanel.classList.add(
            "active"
        );

        registerPanel.classList.remove(
            "active"
        );

        loginTab.classList.add(
            "active"
        );

        registerTab.classList.remove(
            "active"
        );

    } else {

        loginPanel.classList.remove(
            "active"
        );

        registerPanel.classList.add(
            "active"
        );

        loginTab.classList.remove(
            "active"
        );

        registerTab.classList.add(
            "active"
        );
    }
}

function registerRequest() {

    var email =
        document.getElementById(
            "registerEmail"
        ).value.trim();

    var password =
        document.getElementById(
            "registerPassword"
        ).value;

    var confirm =
        document.getElementById(
            "registerPasswordConfirm"
        ).value;

    if (!email || !password) {

        alert(
            "กรุณากรอกข้อมูลให้ครบ"
        );

        return;
    }

    if (password.length < 6) {

        alert(
            "รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร"
        );

        return;
    }

    if (password !== confirm) {

        alert(
            "รหัสผ่านไม่ตรงกัน"
        );

        return;
    }

    registerEmail =
        email;

    api(
        "register_request",
        {
            email:email,
            password:password
        },
        function(networkOK,result) {

            if (
                !networkOK ||
                !result.ok
            ) {

                alert(
                    result &&
                    result.message
                        ? result.message
                        : "สมัครสมาชิกไม่สำเร็จ"
                );

                return;
            }

            closeAuth();

            document
                .getElementById(
                    "otpOverlay"
                )
                .classList.add(
                    "active"
                );

            document
                .getElementById(
                    "otpCode"
                ).value = "";

            alert(
                result.message
            );
        }
    );
}

        document.getElementById(

    if (
        !/^[0-9]{6}$/.test(code)

        return;
    }

    api(
        "register_verify",
        {
            email:
                registerEmail,

            code:
                code
        },
        function(networkOK,result) {

            if (
                !networkOK ||
                !result.ok
            ) {

                alert(
                    result &&
                    result.message
                        ? result.message
                        : "ยืนยัน OTP ไม่สำเร็จ"

            currentUser =

            closeOtp();

            alert(

        }
    );
}

                        ) +

    box.innerHTML =
        html;
}

function enableSeller() {

    if (!currentUser) {
        openAuth();
        return;
    }

    api(
        "enable_seller",
        {},
        function(networkOK,result) {

            if (
                !networkOK ||
                !result.ok
            ) {

                alert(
                    result &&
                    result.message
                        ? result.message
                        : "เปิด Seller ไม่สำเร็จ"
                );

                return;
            }

            currentUser =
                result.user ||
                currentUser;

            renderAccount();

            alert(
                result.message
            );

            openSellerPanel();
        }
    );
}

function openSellerPanel() {

    if (!currentUser) {
        openAuth();
        return;
    }

    if (
        Number(currentUser.is_seller) !== 1
    ) {

        alert(
            "บัญชีนี้ยังไม่ได้เปิด Seller"
        );

        return;
    }

    var box =
        document.getElementById(
            "sellerBox"
        );

    if (!box) {
        renderAccount();

        box =
            document.getElementById(
                "sellerBox"
            );
    }

    loadSellerPanel();
}

function loadSellerPanel() {

    if (!currentUser) {
        return;
    }

    api(
        "seller_areas",
        {},
        function(networkOK,result) {

            if (
                !networkOK ||
                !result.ok
            ) {

                alert(
                    result &&
                    result.message
                        ? result.message
                        : "โหลดพื้นที่ไม่สำเร็จ"
                );

                return;
            }

            var areas =
                result.areas || [];

            api(
                "seller_routes",
                {},
                function(
                    routeNetworkOK,
                    routeResult
                ) {

                    var routes =
                        routeNetworkOK &&
                        routeResult.ok
                            ? (
                                routeResult.routes ||
                                []
                            )
                            : [];

                    renderSellerPanel(
                        areas,
                        routes
                    );
                }
            );
        }
    );
}

function renderSellerPanel(
    areas,
    routes
) {

    var box =
        document.getElementById(
            "sellerBox"
        );

    if (!box) {
        return;
    }

    var areaOptions =
        '<option value="">เลือกพื้นที่</option>';

    for (
        var i = 0;
        i < areas.length;
        i++
    ) {

        areaOptions +=
            '<option value="' +
            Number(areas[i].id) +
            '">' +
            escapeHtml(
                areas[i].province +
                ' / ' +
                areas[i].district +
                ' / ' +
                areas[i].subdistrict
            ) +
            '</option>';
    }

    var html =

        '<div class="card">' +

            '<h2>' +
                'Seller' +
            '</h2>' +

            '<div class="seller-section">' +

                '<h3>' +
                    'เพิ่มพื้นที่' +
                '</h3>' +

                '<div style="margin-top:12px">' +

                    '<div class="form-group">' +

                        '<label class="form-label">' +
                            'จังหวัด' +
                        '</label>' +

                        '<input id="sellerProvince" class="form-input">' +

                    '</div>' +

                    '<div class="form-group">' +

                        '<label class="form-label">' +
                            'อำเภอ' +
                        '</label>' +

                        '<input id="sellerDistrict" class="form-input">' +

                    '</div>' +

                    '<div class="form-group">' +

                        '<label class="form-label">' +
                            'ตำบล' +
                        '</label>' +

                        '<input id="sellerSubdistrict" class="form-input">' +

                    '</div>' +

                    '<button class="primary-btn" onclick="saveSellerArea()">' +
                        'เพิ่มพื้นที่' +
                    '</button>' +

                '</div>' +

            '</div>' +

            '<div class="seller-section">' +

                '<h3>' +
                    'พื้นที่ของฉัน' +
                '</h3>' +

                '<div>';

    if (areas.length === 0) {

        html +=
            '<div style="color:#64748b;margin-top:10px">' +
                'ยังไม่มีพื้นที่' +
            '</div>';

    } else {

        for (
            var j = 0;
            j < areas.length;
            j++
        ) {

            html +=
                '<div class="seller-area">' +

                    '<div class="seller-area-head">' +

                        '<div>' +

                            '<strong>' +
                                escapeHtml(
                                    areas[j].province
                                ) +
                            '</strong>' +

                            '<div style="color:#64748b;font-size:13px;margin-top:4px">' +
                                escapeHtml(
                                    areas[j].district
                                ) +
                                ' / ' +
                                escapeHtml(
                                    areas[j].subdistrict
                                ) +
                            '</div>' +

                        '</div>' +

                        '<button class="danger-btn" onclick="deleteSellerArea(' +
                            Number(areas[j].id) +
                        ')">' +
                            'ลบ' +
                        '</button>' +

                    '</div>' +

                '</div>';
        }
    }

    html +=
                '</div>' +
            '</div>' +

            '<div class="seller-section">' +

                '<h3>' +
                    'เพิ่มรอบส่ง' +
                '</h3>' +

                '<div style="margin-top:12px">' +

                    '<div class="form-group">' +

                        '<label class="form-label">' +
                            'พื้นที่' +
                        '</label>' +

                        '<select id="sellerAreaId" class="form-select">' +
                            areaOptions +
                        '</select>' +

                    '</div>' +

                    '<div class="form-group">' +

                        '<label class="form-label">' +
                            'วัน' +
                        '</label>' +

                        '<select id="sellerDay" class="form-select">' +

                            '<option value="1">จันทร์</option>' +
                            '<option value="2">อังคาร</option>' +
                            '<option value="3">พุธ</option>' +
                            '<option value="4">พฤหัสบดี</option>' +
                            '<option value="5">ศุกร์</option>' +
                            '<option value="6">เสาร์</option>' +

                        '</select>' +

                    '</div>' +

                    '<div class="form-group">' +

                        '<label class="form-label">' +
                            'รอบ' +
                        '</label>' +

                        '<select id="sellerRound" class="form-select">' +

                            '<option value="1">รอบ 1</option>' +
                            '<option value="2">รอบ 2</option>' +
                            '<option value="3">รอบ 3</option>' +
                            '<option value="4">รอบ 4</option>' +
                            '<option value="5">รอบ 5</option>' +

                        '</select>' +

                    '</div>' +

                    '<button class="primary-btn" onclick="saveSellerRoute()">' +
                        'เพิ่มรอบ' +
                    '</button>' +

                '</div>' +

            '</div>' +

            '<div class="seller-section">' +

                '<h3>' +
                    'รอบส่งของฉัน' +
                '</h3>';

    if (
        !routes ||
        routes.length === 0
    ) {

        html +=
            '<div style="color:#64748b;margin-top:10px">' +
                'ยังไม่มีรอบส่ง' +
            '</div>';

    } else {

        html +=
            '<div class="route-list">';

        for (
            var r = 0;
            r < routes.length;
            r++
        ) {

            html +=
                '<div class="route-item">' +

                    '<div>' +

                        '<strong>' +
                            escapeHtml(
                                routes[r].province
                            ) +
                        '</strong>' +

                        '<div style="font-size:13px;color:#64748b">' +
                            escapeHtml(
                                routes[r].district
                            ) +
                            ' / ' +
                            escapeHtml(
                                routes[r].subdistrict
                            ) +
                            ' · ' +
                            dayName(
                                routes[r].day_of_week
                            ) +
                            ' · รอบ ' +
                            Number(
                                routes[r].round_no
                            ) +
                        '</div>' +

                    '</div>' +

                    '<button class="danger-btn" onclick="deleteSellerRoute(' +
                        Number(routes[r].id) +
                    ')">' +
                        'ลบ' +
                    '</button>' +

                '</div>';
        }

        html +=
            '</div>';
    }

    html +=
            '</div>' +

        '</div>';

    box.innerHTML =
        html;
}

function saveSellerArea() {

    var province =
        document.getElementById(
            "sellerProvince"
        ).value.trim();

    var district =
        document.getElementById(
            "sellerDistrict"
        ).value.trim();

    var subdistrict =
        document.getElementById(
            "sellerSubdistrict"
        ).value.trim();

    if (
        !province ||
        !district ||
        !subdistrict
    ) {

        alert(
            "กรุณากรอกพื้นที่ให้ครบ"
        );

        return;
    }

    api(
        "seller_area_save",
        {
            province:province,
            district:district,
            subdistrict:subdistrict
        },
        function(networkOK,result) {

            if (
                !networkOK ||
                !result.ok
            ) {

                alert(
                    result &&
                    result.message
                        ? result.message
                        : "เพิ่มพื้นที่ไม่สำเร็จ"
                );

                return;
            }

            loadSellerPanel();

            alert(
                result.message
            );
        }
    );
}

function dayName(day) {

    var names = {
        1:"จันทร์",
        2:"อังคาร",
        3:"พุธ",
        4:"พฤหัสบดี",
        5:"ศุกร์",
        6:"เสาร์",
        7:"อาทิตย์"
    };

    return names[
        Number(day)
    ] || "";
}

function setTodayMinDate() {

    var element =
        document.getElementById(
            "deliveryDate"
        );

    if (!element) {
        return;
    }

    var now =
        new Date();

    var year =
        now.getFullYear();

    var month =
        String(
            now.getMonth() + 1
        ).padStart(2,"0");

    var day =
        String(
            now.getDate()
        ).padStart(2,"0");

    element.min =
        year +
        "-" +
        month +
        "-" +
        day;
}

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadProducts();

        loadCurrentUser(
            function(user) {

                currentUser =
                    user;

                updateHeaderAccount();

                renderAccount();
            }
        );

        updateCartCount();

        setTodayMinDate();

        document
            .getElementById(
                "deliveryDate"
            )
            .addEventListener(
                "change",
                function() {

                    if (!this.value) {
                        return;
                    }

                    var date =
                        new Date(
                            this.value +
                            "T00:00:00"
                        );

                    if (
                        date.getDay() === 0
                    ) {

                        alert(
                            "ไม่สามารถเลือกวันอาทิตย์ได้"
                        );

                        this.value = "";
                    }
                }
            );
    }
);
