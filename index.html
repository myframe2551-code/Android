<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APP BETAGEN</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Tahoma, sans-serif;
    background: #0F172A;
    color: #FFFFFF;
    min-height: 100vh;
}

/* =========================
   HEADER
========================= */

.header {
    height: 68px;
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0F172A;
    border-bottom: 1px solid #17243A;
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    font-size: 19px;
    font-weight: 800;
}

.back-button {
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 12px;
    background: #111D32;
    color: #FFFFFF;
    font-size: 27px;
    cursor: pointer;
    display: none;
}

.cart-button {
    width: 43px;
    height: 43px;
    border: 0;
    border-radius: 13px;
    background: #111D32;
    color: #FFFFFF;
    font-size: 21px;
    cursor: pointer;
    position: relative;
}

.cart-count {
    position: absolute;
    top: -5px;
    right: -5px;
    min-width: 20px;
    height: 20px;
    padding: 0 5px;
    border-radius: 20px;
    background: #3B82F6;
    color: #FFFFFF;
    font-size: 11px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* =========================
   PAGE
========================= */

.page {
    display: none;
}

.page.active {
    display: block;
}

/* =========================
   PRODUCT TITLE
========================= */

.title-section {
    text-align: center;
    padding: 35px 18px 25px;
}

.brand {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    min-width: 170px;
    height: 58px;

    padding: 0 25px;

    border-radius: 50%;

    background: #FFFFFF;
    border: 5px solid #E31B23;

    color: #E31B23;

    font-size: 24px;
    font-weight: 900;
    font-style: italic;

    margin-bottom: 18px;
}

.title-section h1 {
    font-size: 31px;
    font-weight: 800;
}

.title-section p {
    margin-top: 8px;
    color: #94A3B8;
    font-size: 14px;
}

/* =========================
   PRODUCTS
========================= */

.container {
    width: 100%;
    max-width: 1050px;
    margin: auto;
    padding: 0 15px 45px;
}

.products {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 15px;
}

.product {
    background: #101D32;
    border: 1px solid #1D3A61;
    border-radius: 21px;
    overflow: hidden;
    transition: 0.2s;
}

.product:hover {
    border-color: #2563EB;
    transform: translateY(-3px);
}

.product-image {
    width: calc(100% - 16px);
    margin: 8px;

    aspect-ratio: 16 / 10;

    border-radius: 16px;

    background: #17243A;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.image-placeholder {
    color: #64748B;
    font-size: 13px;
}

.product-info {
    padding: 5px 16px 16px;
}

.product-name {
    text-align: center;
    font-size: 18px;
    font-weight: 800;
}

.product-detail {
    text-align: center;
    color: #8FA8C9;
    font-size: 13px;
    margin-top: 7px;
    min-height: 18px;
}

.product-bottom {
    display: flex;
    gap: 8px;
    margin-top: 14px;
}

.price {
    flex: 1;

    min-height: 43px;

    display: flex;
    align-items: center;

    padding: 0 13px;

    border-radius: 22px;

    background: #0D1A2E;
    border: 1px solid #193454;

    font-size: 16px;
    font-weight: 800;
}

.select-button {
    flex: 1;

    min-height: 43px;

    border: 0;
    border-radius: 22px;

    background: #3B82F6;
    color: #FFFFFF;

    font-size: 14px;
    font-weight: 800;

    cursor: pointer;
}

.select-button:active {
    transform: scale(0.96);
}

/* =========================
   CART
========================= */

.cart-container {
    width: 100%;
    max-width: 850px;
    margin: auto;
    padding: 25px 15px 50px;
}

.cart-title {
    margin-bottom: 20px;
}

.cart-title h1 {
    font-size: 28px;
}

.cart-title p {
    color: #94A3B8;
    font-size: 14px;
    margin-top: 6px;
}

/* CART ITEM */

.cart-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.cart-item {
    background: #101D32;
    border: 1px solid #1D3A61;
    border-radius: 18px;
    padding: 12px;

    display: flex;
    align-items: center;
    gap: 13px;
}

.cart-image {
    width: 75px;
    height: 75px;

    flex-shrink: 0;

    border-radius: 13px;

    background: #17243A;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

.cart-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.cart-info {
    flex: 1;
    min-width: 0;
}

.cart-name {
    font-size: 16px;
    font-weight: 800;
}

.cart-flavor {
    color: #8FA8C9;
    font-size: 12px;
    margin-top: 4px;
}

.cart-unit-price {
    color: #CBD5E1;
    font-size: 12px;
    margin-top: 5px;
}

/* QUANTITY */

.quantity {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 9px;
}

.quantity button {
    width: 28px;
    height: 28px;

    border: 1px solid #29466B;
    border-radius: 8px;

    background: #0D1A2E;
    color: #FFFFFF;

    font-size: 17px;
    cursor: pointer;
}

.quantity span {
    min-width: 20px;
    text-align: center;
    font-size: 14px;
    font-weight: 800;
}

.cart-total {
    text-align: right;
    min-width: 90px;
}

.cart-total-label {
    color: #64748B;
    font-size: 11px;
}

.cart-total-price {
    margin-top: 4px;
    font-size: 17px;
    font-weight: 800;
}

.remove-button {
    margin-top: 7px;

    border: 0;
    background: transparent;

    color: #EF4444;

    font-size: 11px;
    cursor: pointer;
}

/* =========================
   EMPTY CART
========================= */

.empty-cart {
    text-align: center;
    padding: 70px 20px;
    background: #101D32;
    border: 1px solid #1D3A61;
    border-radius: 20px;
}

.empty-icon {
    font-size: 45px;
    margin-bottom: 15px;
}

.empty-cart h2 {
    font-size: 21px;
}

.empty-cart p {
    color: #94A3B8;
    font-size: 13px;
    margin-top: 7px;
}

/* =========================
   CART SUMMARY
========================= */

.summary {
    margin-top: 18px;

    background: #101D32;
    border: 1px solid #1D3A61;
    border-radius: 20px;

    padding: 20px;
}

.summary-row {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 8px 0;

    color: #CBD5E1;
    font-size: 14px;
}

.summary-total {
    margin-top: 10px;
    padding-top: 16px;

    border-top: 1px solid #263B56;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.summary-total span:first-child {
    font-size: 18px;
    font-weight: 800;
}

.total-price {
    color: #3B82F6;
    font-size: 25px;
    font-weight: 900;
}

/* =========================
   BUTTONS
========================= */

.cart-actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
}

.continue-button,
.checkout-button {
    flex: 1;

    min-height: 48px;

    border-radius: 14px;

    font-size: 14px;
    font-weight: 800;

    cursor: pointer;
}

.continue-button {
    border: 1px solid #29466B;
    background: #111D32;
    color: #FFFFFF;
}

.checkout-button {
    border: 0;
    background: #3B82F6;
    color: #FFFFFF;
}

.checkout-button:active,
.continue-button:active {
    transform: scale(0.98);
}

/* =========================
   FOOTER
========================= */

.footer {
    text-align: center;
    color: #64748B;
    font-size: 12px;
    padding: 25px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .header {
        height: 62px;
        padding: 0 13px;
    }

    .logo {
        font-size: 17px;
    }

    .title-section {
        padding: 28px 12px 22px;
    }

    .brand {
        min-width: 145px;
        height: 50px;
        font-size: 21px;
    }

    .title-section h1 {
        font-size: 26px;
    }

    .products {
        gap: 9px;
    }

    .product {
        border-radius: 17px;
    }

    .product-image {
        width: calc(100% - 12px);
        margin: 6px;
        border-radius: 13px;
    }

    .product-info {
        padding: 3px 9px 11px;
    }

    .product-name {
        font-size: 14px;
    }

    .product-detail {
        font-size: 10px;
        margin-top: 4px;
    }

    .product-bottom {
        gap: 5px;
        margin-top: 9px;
    }

    .price {
        min-height: 36px;
        padding: 0 8px;
        font-size: 13px;
    }

    .select-button {
        min-height: 36px;
        font-size: 11px;
    }

    .cart-container {
        padding: 20px 11px 40px;
    }

    .cart-item {
        padding: 10px;
        gap: 9px;
    }

    .cart-image {
        width: 62px;
        height: 62px;
    }

    .cart-name {
        font-size: 14px;
    }

    .cart-flavor {
        font-size: 10px;
    }

    .cart-unit-price {
        font-size: 10px;
    }

    .cart-total {
        min-width: 65px;
    }

    .cart-total-price {
        font-size: 14px;
    }

    .cart-actions {
        flex-direction: column;
    }
}

</style>
</head>

<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="header-left">

        <button
            id="backButton"
            class="back-button"
            onclick="showProducts()">
            ‹
        </button>

        <div class="logo">
            APP BETAGEN
        </div>

    </div>


    <button
        class="cart-button"
        onclick="showCart()">

        🛒

        <span
            id="cartCount"
            class="cart-count">
            0
        </span>

    </button>

</header>


<!-- =========================
     PRODUCT PAGE
========================= -->

<section
    id="productPage"
    class="page active">

    <div class="title-section">

        <div class="brand">
            Betagen
        </div>

        <h1>
            นมเปรี้ยว บีทาเก้น
        </h1>

        <p>
            เลือกสินค้าและรสชาติที่คุณชื่นชอบ
        </p>

    </div>


    <main class="container">

        <div
            id="productList"
            class="products">
        </div>

    </main>


    <footer class="footer">
        APP BETAGEN
    </footer>

</section>


<!-- =========================
     CART PAGE
========================= -->

<section
    id="cartPage"
    class="page">

    <main class="cart-container">

        <div class="cart-title">

            <h1>
                รถเข็นสินค้า
            </h1>

            <p>
                ตรวจสอบรายการสินค้าและราคารวม
            </p>

        </div>


        <div id="cartContent">
        </div>

    </main>


    <footer class="footer">
        APP BETAGEN
    </footer>

</section>


<script>

/* =========================
   PRODUCT DATA
========================= */

var products = [

    {
        id: 1,
        name: "รสดั้งเดิม",
        detail: "หอม อร่อย ได้ประโยชน์",
        price: 15,
        image: ""
    },

    {
        id: 2,
        name: "รสสตรอว์เบอร์รี่",
        detail: "หอมหวาน สดชื่น",
        price: 15,
        image: ""
    },

    {
        id: 3,
        name: "รสพีช",
        detail: "หอมละมุน กลมกล่อม",
        price: 15,
        image: ""
    },

    {
        id: 4,
        name: "รสแอปเปิ้ล",
        detail: "หอมสดชื่น เปรี้ยวหวานลงตัว",
        price: 15,
        image: ""
    },

    {
        id: 5,
        name: "รสบลูเบอร์รี่",
        detail: "หอมอร่อย สดชื่น",
        price: 15,
        image: ""
    },

    {
        id: 6,
        name: "รสผลไม้รวม",
        detail: "รวมความอร่อยจากผลไม้",
        price: 15,
        image: ""
    }

];


/* =========================
   CART
========================= */

var cart = [];

try {

    var savedCart = localStorage.getItem("betagen_cart");

    if (savedCart) {
        cart = JSON.parse(savedCart);
    }

    if (!Array.isArray(cart)) {
        cart = [];
    }

} catch (e) {

    cart = [];

}


/* =========================
   SAVE CART
========================= */

function saveCart() {

    try {

        localStorage.setItem(
            "betagen_cart",
            JSON.stringify(cart)
        );

    } catch (e) {

    }

}


/* =========================
   PRODUCT LIST
========================= */

function renderProducts() {

    var html = "";

    for (var i = 0; i < products.length; i++) {

        var product = products[i];

        var imageHTML = "";

        if (product.image) {

            imageHTML =
                '<img src="' +
                product.image +
                '" alt="' +
                product.name +
                '">';

        } else {

            imageHTML =
                '<div class="image-placeholder">' +
                'รูปสินค้า' +
                '</div>';

        }


        html +=

            '<div class="product">' +

                '<div class="product-image">' +
                    imageHTML +
                '</div>' +

                '<div class="product-info">' +

                    '<div class="product-name">' +
                        product.name +
                    '</div>' +

                    '<div class="product-detail">' +
                        product.detail +
                    '</div>' +

                    '<div class="product-bottom">' +

                        '<div class="price">' +
                            formatPrice(product.price) +
                        ' ฿</div>' +

                        '<button ' +
                            'class="select-button" ' +
                            'onclick="addToCart(' +
                                product.id +
                            ')">' +
                            'เลือก' +
                        '</button>' +

                    '</div>' +

                '</div>' +

            '</div>';

    }

    document.getElementById("productList").innerHTML = html;

}


/* =========================
   ADD TO CART
========================= */

function addToCart(id) {

    var product = findProduct(id);

    if (!product) {
        return;
    }


    var found = false;

    for (var i = 0; i < cart.length; i++) {

        if (cart[i].id === id) {

            cart[i].quantity++;

            found = true;

            break;
        }

    }


    if (!found) {

        cart.push({

            id: id,

            quantity: 1

        });

    }


    saveCart();

    updateCartCount();

}


/* =========================
   FIND PRODUCT
========================= */

function findProduct(id) {

    for (var i = 0; i < products.length; i++) {

        if (products[i].id === id) {
            return products[i];
        }

    }

    return null;

}


/* =========================
   UPDATE CART COUNT
========================= */

function updateCartCount() {

    var count = 0;

    for (var i = 0; i < cart.length; i++) {

        count += cart[i].quantity;

    }


    document.getElementById("cartCount").innerText = count;

}


/* =========================
   CART PAGE
========================= */

function renderCart() {

    var container =
        document.getElementById("cartContent");


    if (cart.length === 0) {

        container.innerHTML =

            '<div class="empty-cart">' +

                '<div class="empty-icon">' +
                    '🛒' +
                '</div>' +

                '<h2>' +
                    'ยังไม่มีสินค้าในรถเข็น' +
                '</h2>' +

                '<p>' +
                    'เลือกสินค้าที่ต้องการเพื่อเพิ่มลงรถเข็น' +
                '</p>' +

            '</div>';

        return;

    }


    var html =
        '<div class="cart-list">';


    var totalItems = 0;
    var totalPrice = 0;


    for (var i = 0; i < cart.length; i++) {

        var item = cart[i];

        var product =
            findProduct(item.id);


        if (!product) {
            continue;
        }


        var itemTotal =
            product.price *
            item.quantity;


        totalItems +=
            item.quantity;


        totalPrice +=
            itemTotal;


        var imageHTML = "";

        if (product.image) {

            imageHTML =
                '<img src="' +
                product.image +
                '" alt="' +
                product.name +
                '">';

        } else {

            imageHTML =
                '<div class="image-placeholder">' +
                'รูป' +
                '</div>';

        }


        html +=

            '<div class="cart-item">' +

                '<div class="cart-image">' +
                    imageHTML +
                '</div>' +


                '<div class="cart-info">' +

                    '<div class="cart-name">' +
                        product.name +
                    '</div>' +

                    '<div class="cart-flavor">' +
                        product.detail +
                    '</div>' +

                    '<div class="cart-unit-price">' +
                        'ราคา ' +
                        formatPrice(product.price) +
                        ' ฿ / ชิ้น' +
                    '</div>' +


                    '<div class="quantity">' +

                        '<button ' +
                            'onclick="changeQuantity(' +
                                product.id +
                                ', -1)">' +
                            '−' +
                        '</button>' +

                        '<span>' +
                            item.quantity +
                        '</span>' +

                        '<button ' +
                            'onclick="changeQuantity(' +
                                product.id +
                                ', 1)">' +
                            '+' +
                        '</button>' +

                    '</div>' +

                '</div>' +


                '<div class="cart-total">' +

                    '<div class="cart-total-label">' +
                        'รวม' +
                    '</div>' +

                    '<div class="cart-total-price">' +
                        formatPrice(itemTotal) +
                        ' ฿' +
                    '</div>' +

                    '<button ' +
                        'class="remove-button" ' +
                        'onclick="removeFromCart(' +
                            product.id +
                        ')">' +
                        'ลบ' +
                    '</button>' +

                '</div>' +

            '</div>';

    }


    html +=
        '</div>';


    /* =========================
       SUMMARY
    ========================= */

    html +=

        '<div class="summary">' +

            '<div class="summary-row">' +

                '<span>จำนวนสินค้า</span>' +

                '<span>' +
                    totalItems +
                    ' ชิ้น' +
                '</span>' +

            '</div>' +


            '<div class="summary-row">' +

                '<span>ราคาสินค้ารวม</span>' +

                '<span>' +
                    formatPrice(totalPrice) +
                    ' ฿' +
                '</span>' +

            '</div>' +


            '<div class="summary-total">' +

                '<span>ราคารวมทั้งหมด</span>' +

                '<span class="total-price">' +
                    formatPrice(totalPrice) +
                    ' ฿' +
                '</span>' +

            '</div>' +


            '<div class="cart-actions">' +

                '<button ' +
                    'class="continue-button" ' +
                    'onclick="showProducts()">' +
                    'เลือกสินค้าต่อ' +
                '</button>' +

                '<button ' +
                    'class="checkout-button" ' +
                    'onclick="checkout()">' +
                    'ดำเนินการต่อ' +
                '</button>' +

            '</div>' +

        '</div>';


    container.innerHTML = html;

}


/* =========================
   CHANGE QUANTITY
========================= */

function changeQuantity(id, amount) {

    for (var i = 0; i < cart.length; i++) {

        if (cart[i].id === id) {

            cart[i].quantity += amount;


            if (cart[i].quantity <= 0) {

                cart.splice(i, 1);

            }


            break;

        }

    }


    saveCart();

    updateCartCount();

    renderCart();

}


/* =========================
   REMOVE
========================= */

function removeFromCart(id) {

    for (var i = 0; i < cart.length; i++) {

        if (cart[i].id === id) {

            cart.splice(i, 1);

            break;

        }

    }


    saveCart();

    updateCartCount();

    renderCart();

}


/* =========================
   PAGE PRODUCTS
========================= */

function showProducts() {

    document
        .getElementById("cartPage")
        .classList.remove("active");


    document
        .getElementById("productPage")
        .classList.add("active");


    document
        .getElementById("backButton")
        .style.display = "none";


    window.scrollTo(0, 0);

}


/* =========================
   PAGE CART
========================= */

function showCart() {

    document
        .getElementById("productPage")
        .classList.remove("active");


    document
        .getElementById("cartPage")
        .classList.add("active");


    document
        .getElementById("backButton")
        .style.display = "block";


    renderCart();

    window.scrollTo(0, 0);

}


/* =========================
   CHECKOUT
========================= */

function checkout() {

    if (cart.length === 0) {
        return;
    }


    var total = 0;


    for (var i = 0; i < cart.length; i++) {

        var product =
            findProduct(cart[i].id);


        if (product) {

            total +=
                product.price *
                cart[i].quantity;

        }

    }


    alert(
        "ราคารวมทั้งหมด " +
        formatPrice(total) +
        " ฿"
    );

}


/* =========================

        {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2

}
